<marker id="deployment-remote-docker-deployment-remote-docker-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#577dab"/></marker>
<marker id="deployment-remote-docker-deployment-remote-docker-storage" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#43816c"/></marker>
</defs><rect width="1600" height="1520" fill="#fff"/>
<text x="40" y="52" font-size="28" font-weight="600" fill="#33455e">远程 Docker Engine · 双主机部署</text>
<text x="40" y="84" font-size="14" font-weight="400" fill="#596b83">示例将平台与 DB / MQ 放在主机 A，运行实例放在主机 B；共享存储位置单独标出</text>
<rect x="40" y="104" width="16" height="16" rx="3" fill="#eef5ff" stroke="#8eafe0"/>
<text x="64" y="117" font-size="12" font-weight="400" fill="#33455e">平台 / 应用</text>
<rect x="260" y="104" width="16" height="16" rx="3" fill="#eaf6f4" stroke="#8ebeb3"/>
<text x="284" y="117" font-size="12" font-weight="400" fill="#33455e">运行实例</text>
<rect x="480" y="104" width="16" height="16" rx="3" fill="#edf5eb" stroke="#a4be97"/>
<text x="504" y="117" font-size="12" font-weight="400" fill="#33455e">数据 / 存储</text>
<rect x="700" y="104" width="16" height="16" rx="3" fill="#fff5e7" stroke="#d5b78b"/>
<text x="724" y="117" font-size="12" font-weight="400" fill="#33455e">网关 / 中间件</text>
<rect x="920" y="104" width="16" height="16" rx="3" fill="#f4f6f9" stroke="#b3bfce"/>
<text x="944" y="117" font-size="12" font-weight="400" fill="#33455e">外部 / 基础设施</text>
<g data-zone="a"><rect x="328" y="164" width="560" height="700" rx="8" fill="#fafbfc" stroke="#b3bfce" stroke-width="1.5"/>
<text x="352" y="196" font-size="14" font-weight="600" fill="#33455e">主机 A · 开发平台与依赖</text>
<text x="352" y="220" font-size="12" font-weight="400" fill="#596b83">CPU / 内存 / 磁盘待规划；本机 Compose 网络</text>
</g>
<g data-zone="b"><rect x="928" y="164" width="632" height="700" rx="8" fill="#fafbfc" stroke="#b3bfce" stroke-width="1.5"/>
<text x="952" y="196" font-size="14" font-weight="600" fill="#33455e">主机 B · 目标 Docker Engine</text>
<text x="952" y="220" font-size="12" font-weight="400" fill="#596b83">CPU / 内存 / 磁盘待规划；独立实例网络</text>
</g>
<g data-zone="storage"><rect x="328" y="904" width="1232" height="196" rx="8" fill="#fafbfc" stroke="#b3bfce" stroke-width="1.5"/>
<text x="352" y="936" font-size="14" font-weight="600" fill="#33455e">共享存储服务 · 两台主机挂载同一份内容</text>
<text x="352" y="960" font-size="12" font-weight="400" fill="#596b83">后端类型、容量、冗余与协议由实施方确定</text>
</g>
