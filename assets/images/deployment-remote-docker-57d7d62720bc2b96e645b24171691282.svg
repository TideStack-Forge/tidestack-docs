<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1520" width="1600" height="1520" role="img" aria-labelledby="deployment-remote-docker-title deployment-remote-docker-desc" id="deployment-remote-docker-root">
<title id="deployment-remote-docker-title">远程 Docker Engine · 双主机部署</title>
<desc id="deployment-remote-docker-desc">示例将平台与 DB / MQ 放在主机 A，运行实例放在主机 B；共享存储位置单独标出；包含部署位置、数量、网络连接、挂载及单点说明。</desc>
<defs>
      <style>#deployment-remote-docker-root { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
      #deployment-remote-docker-root .diagram-container { width:100%;overflow-x:auto }
      #deployment-remote-docker-root .diagram-container svg { display:block;width:100%;min-width:1600px;height:auto }
      @media print {
#deployment-remote-docker-root .diagram-container { overflow-x:visible }
      #deployment-remote-docker-root .diagram-container svg { min-width:0 }
}
      #deployment-remote-docker-root text { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif }</style><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
