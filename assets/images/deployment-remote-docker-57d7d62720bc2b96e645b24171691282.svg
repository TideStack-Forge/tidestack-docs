<path data-edge="4" d="M1392 660 L1392 980" fill="none" stroke="#43816c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#deployment-remote-docker-deployment-remote-docker-storage)"/>
<g data-edge-label="0"><rect x="298" y="264" width="44" height="24" rx="3" fill="#fff"/><text x="320" y="280" font-size="12" font-weight="400" fill="#43546c" text-anchor="middle">HTTP</text></g>
<g data-edge-label="1"><rect x="1269" y="440" width="150" height="24" rx="3" fill="#fff"/><text x="1344" y="456" font-size="12" font-weight="400" fill="#43546c" text-anchor="middle">B：应用端口 p → :80</text></g>
<g data-edge-label="2"><rect x="865" y="320" width="86" height="24" rx="3" fill="#fff"/><text x="908" y="336" font-size="12" font-weight="400" fill="#577dab" text-anchor="middle">Docker API</text></g>
<g data-edge-label="3"><rect x="647.5" y="780" width="81" height="24" rx="3" fill="#fff"/><text x="688" y="796" font-size="12" font-weight="400" fill="#43816c" text-anchor="middle">工作区写入</text></g>
<g data-edge-label="4"><rect x="1430" y="796" width="68" height="24" rx="3" fill="#fff"/><text x="1464" y="812" font-size="12" font-weight="400" fill="#43816c" text-anchor="middle">实例挂载</text></g>
<g data-node="browser"><rect x="40" y="224" width="240" height="128" rx="6" fill="#f4f6f9" stroke="#b3bfce" stroke-width="1.5"/>
<rect x="40" y="248" width="4" height="24" fill="#b3bfce"/>
<rect x="192" y="244" width="64" height="22" rx="3" fill="#fff" stroke="#b3bfce"/><text x="224.0" y="260" font-size="12" font-weight="400" fill="#52657f" text-anchor="middle">用户网络</text>
<text x="64" y="264" font-size="16" font-weight="600" fill="#52657f">用户浏览器</text>
<text x="64" y="300" font-size="12" font-weight="400" fill="#596b83">平台地址 / 主机 B 应用端口</text>
</g>
<g data-node="platform"><rect x="360" y="264" width="496" height="128" rx="6" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.5"/>
<rect x="360" y="288" width="4" height="24" fill="#8eafe0"/>
<rect x="797" y="284" width="35" height="22" rx="3" fill="#fff" stroke="#8eafe0"/><text x="814.5" y="300" font-size="12" font-weight="400" fill="#204f86" text-anchor="middle">×1</text>
<text x="384" y="304" font-size="16" font-weight="600" fill="#204f86">开发平台</text>
<text x="384" y="340" font-size="12" font-weight="400" fill="#596b83">ouroboros-develop:&lt;v&gt;</text>
<text x="384" y="364" font-size="12" font-weight="400" fill="#596b83">主机 A 的平台端口 → 容器 :80</text>
</g>
<g data-node="engine"><rect x="960" y="264" width="568" height="128" rx="6" fill="#f4f6f9" stroke="#b3bfce" stroke-width="1.5"/>
<rect x="960" y="288" width="4" height="24" fill="#b3bfce"/>
<rect x="1469" y="284" width="35" height="22" rx="3" fill="#fff" stroke="#b3bfce"/><text x="1486.5" y="300" font-size="12" font-weight="400" fill="#52657f" text-anchor="middle">×1</text>
<text x="984" y="304" font-size="16" font-weight="600" fill="#52657f">Docker Engine</text>
<text x="984" y="340" font-size="12" font-weight="400" fill="#596b83">受保护 API / 受控代理；端口依接入方案</text>
<text x="984" y="364" font-size="12" font-weight="400" fill="#596b83">只连接这个 Engine，不提供多 Engine 调度</text>
</g>
<g data-node="mysql"><rect x="360" y="516" width="232" height="144" rx="6" fill="#edf5eb" stroke="#a4be97" stroke-width="1.5"/>
<rect x="360" y="540" width="4" height="24" fill="#a4be97"/>
<rect x="533" y="536" width="35" height="22" rx="3" fill="#fff" stroke="#a4be97"/><text x="550.5" y="552" font-size="12" font-weight="400" fill="#42663a" text-anchor="middle">×1</text>
<text x="384" y="556" font-size="16" font-weight="600" fill="#42663a">MySQL 8.0</text>
<text x="384" y="592" font-size="12" font-weight="400" fill="#596b83">平台库 / 测试业务库</text>
<text x="384" y="616" font-size="12" font-weight="400" fill="#596b83">向 B 提供受限 :3306</text>
</g>
<g data-node="mq"><rect x="624" y="516" width="232" height="144" rx="6" fill="#fff5e7" stroke="#d5b78b" stroke-width="1.5"/>
<rect x="624" y="540" width="4" height="24" fill="#d5b78b"/>
<rect x="797" y="536" width="35" height="22" rx="3" fill="#fff" stroke="#d5b78b"/><text x="814.5" y="552" font-size="12" font-weight="400" fill="#805d2e" text-anchor="middle">×1</text>
<text x="648" y="556" font-size="16" font-weight="600" fill="#805d2e">RabbitMQ</text>
<text x="648" y="592" font-size="12" font-weight="400" fill="#596b83">AMQP :5672</text>
<text x="648" y="616" font-size="12" font-weight="400" fill="#596b83">地址从 B 可达</text>
</g>
<g data-node="apps"><rect x="960" y="516" width="264" height="144" rx="6" fill="#eaf6f4" stroke="#8ebeb3" stroke-width="1.5"/>
<rect x="960" y="540" width="4" height="24" fill="#8ebeb3"/>
<rect x="1151" y="536" width="49" height="22" rx="3" fill="#fff" stroke="#8ebeb3"/><text x="1175.5" y="552" font-size="12" font-weight="400" fill="#28675b" text-anchor="middle">N ×1</text>
<text x="984" y="556" font-size="16" font-weight="600" fill="#28675b">测试应用</text>
<text x="984" y="592" font-size="12" font-weight="400" fill="#596b83">mothership:&lt;v&gt;</text>
<text x="984" y="616" font-size="12" font-weight="400" fill="#596b83">p → 容器 :80</text>
</g>
<g data-node="helper"><rect x="1256" y="516" width="272" height="144" rx="6" fill="#eaf6f4" stroke="#8ebeb3" stroke-width="1.5"/>
<rect x="1256" y="540" width="4" height="24" fill="#8ebeb3"/>
<rect x="1438" y="536" width="66" height="22" rx="3" fill="#fff" stroke="#8ebeb3"/><text x="1471.0" y="552" font-size="12" font-weight="400" fill="#28675b" text-anchor="middle">按需 ×1</text>
<text x="1280" y="556" font-size="16" font-weight="600" fill="#28675b">开发助手</text>
<text x="1280" y="592" font-size="12" font-weight="400" fill="#596b83">mothership:&lt;v&gt;</text>
<text x="1280" y="616" font-size="12" font-weight="400" fill="#596b83">INTERNAL_ONLY</text>
</g>
<g data-node="ashare"><rect x="360" y="980" width="496" height="96" rx="6" fill="#edf5eb" stroke="#a4be97" stroke-width="1.5"/>
<rect x="360" y="1004" width="4" height="24" fill="#a4be97"/>
<rect x="768" y="1000" width="64" height="22" rx="3" fill="#fff" stroke="#a4be97"/><text x="800.0" y="1016" font-size="12" font-weight="400" fill="#42663a" text-anchor="middle">同一存储</text>
<text x="384" y="1020" font-size="16" font-weight="600" fill="#42663a">A 上的平台写入路径</text>
<text x="384" y="1048" font-size="12" font-weight="400" fill="#596b83">平台挂载 /app/deploy/workspace</text>
</g>
<g data-node="bshare"><rect x="960" y="980" width="568" height="96" rx="6" fill="#edf5eb" stroke="#a4be97" stroke-width="1.5"/>
<rect x="960" y="1004" width="4" height="24" fill="#a4be97"/>
<rect x="1440" y="1000" width="64" height="22" rx="3" fill="#fff" stroke="#a4be97"/><text x="1472.0" y="1016" font-size="12" font-weight="400" fill="#42663a" text-anchor="middle">同一存储</text>
<text x="984" y="1020" font-size="16" font-weight="600" fill="#42663a">B 上的实例 bind mount 源路径</text>
<text x="984" y="1048" font-size="12" font-weight="400" fill="#596b83">HOST_WORKSPACE_PATH/run/&lt;app&gt;/&lt;env&gt;</text>
</g>
<rect x="40" y="1160" width="976" height="248" rx="6" fill="#fff" stroke="#b3bfce"/>
<text x="64" y="1196" font-size="14" font-weight="600" fill="#33455e">连接与挂载清单</text>
<text x="64" y="1236" font-size="12" font-weight="600" fill="#33455e">平台 A → Engine B</text>
<text x="368" y="1236" font-size="12" font-weight="400" fill="#596b83">受保护 Docker API；TLS / 代理与客户端实际配置配套验证</text>
<line x1="64" y1="1246" x2="992" y2="1246" stroke="#edf0f4"/>
<text x="64" y="1268" font-size="12" font-weight="600" fill="#33455e">B 上测试应用 → A 上 MySQL</text>
<text x="368" y="1268" font-size="12" font-weight="400" fill="#596b83">TCP :3306；使用 A 的可达地址，不使用 A 的 Compose 服务名</text>
<line x1="64" y1="1278" x2="992" y2="1278" stroke="#edf0f4"/>
<text x="64" y="1300" font-size="12" font-weight="600" fill="#33455e">A 平台与 B 实例 → RabbitMQ</text>
<text x="368" y="1300" font-size="12" font-weight="400" fill="#596b83">AMQP :5672；完整配置实例专用 MQ 或使用双方可达地址</text>
<line x1="64" y1="1310" x2="992" y2="1310" stroke="#edf0f4"/>
<text x="64" y="1332" font-size="12" font-weight="600" fill="#33455e">A / B → 同一共享文件系统</text>
<text x="368" y="1332" font-size="12" font-weight="400" fill="#596b83">各自主机挂载路径可不同；实际内容、权限与文件更新必须一致</text>
<line x1="64" y1="1342" x2="992" y2="1342" stroke="#edf0f4"/>
<text x="64" y="1364" font-size="12" font-weight="600" fill="#33455e">用户 → A 平台 / B 测试应用</text>
<text x="368" y="1364" font-size="12" font-weight="400" fill="#596b83">平台入口属于 A；应用端口属于 B；稳定域名需另按 APISIX 部署</text>
<rect x="1040" y="1160" width="520" height="248" rx="6" fill="#fff9f0" stroke="#d5b78b"/>
<text x="1064" y="1196" font-size="14" font-weight="600" fill="#33455e">数量、规格与故障域</text>
<text x="1064" y="1236" font-size="12" font-weight="400" fill="#805d2e">平台 A ×1；实例宿主机 B ×1</text>
<text x="1064" y="1268" font-size="12" font-weight="400" fill="#805d2e">每个测试应用 / 助手实例 ×1</text>
<text x="1064" y="1300" font-size="12" font-weight="400" fill="#805d2e">A、B 与共享存储均需识别单点</text>
<text x="1064" y="1332" font-size="12" font-weight="400" fill="#805d2e">本图为跨主机落位，不是容器调度集群</text>
<text x="1064" y="1364" font-size="12" font-weight="400" fill="#805d2e">共享目录不会因修改 Docker API 自动复制</text>
<line x1="40" y1="1444" x2="1560" y2="1444" stroke="#b3bfce"/>
<line x1="40" y1="1468" x2="80" y2="1468" stroke="#43546c" stroke-width="2"/><text x="92" y="1473" font-size="12" font-weight="400" fill="#33455e">用户 / 业务流量</text>
<line x1="320" y1="1468" x2="360" y2="1468" stroke="#577dab" stroke-width="2" stroke-dasharray="6 5"/><text x="372" y="1473" font-size="12" font-weight="400" fill="#33455e">管理调用</text>
<line x1="568" y1="1468" x2="608" y2="1468" stroke="#43816c" stroke-width="2" stroke-dasharray="6 5"/><text x="620" y="1473" font-size="12" font-weight="400" fill="#33455e">文件读写 / 挂载</text>
<text x="920" y="1473" font-size="12" font-weight="400" fill="#596b83">v = 配套发行版本；所有图均为有明确假设的部署示例</text>
</svg>
