<rect width="1180" height="900" class="diagram-canvas" x="0" y="0" />
<text x="30" y="33.0" font-size="26" font-weight="600" text-anchor="start" dominant-baseline="central" class="diagram-ink">本地 IDE 与平台测试实例联调</text>
