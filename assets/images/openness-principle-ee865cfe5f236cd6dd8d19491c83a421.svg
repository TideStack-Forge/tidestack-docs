<g data-node="source" data-parent="1"><rect x="40" y="40" width="1120" height="112" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" />
<text x="600" y="92" font-size="22" font-weight="600" text-anchor="middle" class="diagram-label-blue">核心组件全部开源</text>
<text x="600" y="124" font-size="18" text-anchor="middle" class="diagram-muted">项目依赖的基础能力保持透明</text></g>
<g data-node="understanding" data-parent="1"><rect x="40" y="248" width="352" height="112" rx="8" stroke-width="1" class="diagram-surface-teal diagram-border-teal diagram-wash-teal" />
<text x="216" y="300" font-size="22" font-weight="600" text-anchor="middle" class="diagram-label-teal">查看实现</text>
<text x="216" y="332" font-size="18" text-anchor="middle" class="diagram-muted">理解运行机制</text></g>
<g data-node="extension" data-parent="1"><rect x="424" y="248" width="352" height="112" rx="8" stroke-width="1" class="diagram-surface-teal diagram-border-teal diagram-wash-teal" />
<text x="600" y="300" font-size="22" font-weight="600" text-anchor="middle" class="diagram-label-teal">自主验证与扩展</text>
<text x="600" y="332" font-size="18" text-anchor="middle" class="diagram-muted">围绕实际需求使用核心能力</text></g>
<g data-node="contribution" data-parent="1"><rect x="808" y="248" width="352" height="112" rx="8" stroke-width="1" class="diagram-surface-orange diagram-border-orange diagram-wash-orange" />
<text x="984" y="300" font-size="22" font-weight="600" text-anchor="middle" class="diagram-label-orange">参与改进</text>
<text x="984" y="332" font-size="18" text-anchor="middle" class="diagram-muted">将经验回馈到公共能力</text></g>
<text x="600" y="412" font-size="20" text-anchor="middle" class="diagram-muted">开放的实现与契约，为长期维护保留技术选择</text>
</svg>