<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" role="img" aria-labelledby="data-access-control-flow-title data-access-control-flow-desc">
<title id="data-access-control-flow-title">数据权限参数的生效过程</title>
<desc id="data-access-control-flow-desc">权限定义生成角色授权控件，保存的普通字段参数或业务参数经对应解析器和统一授权求值形成行、字段约束，再由数据操作插件与业务查询条件共同执行。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}</style>
<marker id="data-access-control-flow-arrow-43816c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#43816c"/></marker>
<marker id="data-access-control-flow-arrow-627ba4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#627ba4"/></marker>
<marker id="data-access-control-flow-arrow-71839a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#71839a"/></marker>
<marker id="data-access-control-flow-arrow-9577b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#9577b5"/></marker>
</defs>
<rect width="1120" height="800" fill="#ffffff"/>
<text x="40" y="38" font-size="24" font-weight="600" fill="#273e59" text-anchor="start">数据权限参数的生效过程</text>
<rect x="32" y="72" width="1056" height="172" rx="8" fill="#f8fafc" stroke="#dce4ed" stroke-width="1.2"/>
<text x="48" y="97" font-size="16" font-weight="600" fill="#52657f" text-anchor="start">01  定义与授权</text>
<rect x="32" y="336" width="1056" height="176" rx="8" fill="#f8fafc" stroke="#dce4ed" stroke-width="1.2"/>
<text x="48" y="361" font-size="16" font-weight="600" fill="#52657f" text-anchor="start">02  授权求值</text>
<rect x="32" y="592" width="1056" height="172" rx="8" fill="#f8fafc" stroke="#dce4ed" stroke-width="1.2"/>
<text x="48" y="617" font-size="16" font-weight="600" fill="#52657f" text-anchor="start">03  数据执行</text>
<path d="M336 168L424 168" fill="none" stroke="#71839a" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)"/>
<path d="M696 168L784 168" fill="none" stroke="#71839a" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)"/>
<path d="M192 228L192 280Q192 288 200 288L852 288Q860 288 860 296L860 372" fill="none" stroke="#71839a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#data-access-control-flow-arrow-71839a)"/>
<path d="M928 228L928 372" fill="none" stroke="#627ba4" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-627ba4)"/>
<path d="M336 434L424 434" fill="none" stroke="#71839a" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)"/>
<path d="M784 434L696 434" fill="none" stroke="#43816c" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-43816c)"/>
<path d="M560 496L560 628" fill="none" stroke="#9577b5" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-9577b5)"/>
<path d="M336 688L424 688" fill="none" stroke="#71839a" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)"/>
<path d="M696 688L784 688" fill="none" stroke="#43816c" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-43816c)"/>
<text x="536" y="276" font-size="15" font-weight="400" fill="#667b94" text-anchor="start">参数定义</text>
<text x="944" y="292" font-size="15" font-weight="400" fill="#667b94" text-anchor="start">保存值</text>
<text x="576" y="562" font-size="15" font-weight="400" fill="#667b94" text-anchor="start">最终行范围与字段范围</text>
<rect x="56" y="116" width="272" height="104" rx="6" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.2"/>
<text x="192.0" y="147" font-size="20" font-weight="600" fill="#204f86" text-anchor="middle">权限参数定义</text>
<text x="192.0" y="177" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">字段、范围参数与授权控件</text>
<text x="192.0" y="201" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">AccessControlDefine</text>
<rect x="432" y="116" width="256" height="104" rx="6" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.2"/>
<text x="560.0" y="147" font-size="20" font-weight="600" fill="#204f86" text-anchor="middle">角色授权界面</text>
<text x="560.0" y="177" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">根据定义显示配置控件</text>
<text x="560.0" y="201" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">管理员选择数据范围</text>
<rect x="792" y="116" width="272" height="104" rx="6" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.2"/>
<text x="928.0" y="147" font-size="20" font-weight="600" fill="#204f86" text-anchor="middle">角色参数值</text>
<text x="928.0" y="177" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">regionCode = A</text>
<text x="928.0" y="201" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">amount.$gte = 100</text>
<rect x="56" y="380" width="272" height="108" rx="6" fill="#ffffff" stroke="#b3bfce" stroke-width="1.2"/>
<text x="192.0" y="411" font-size="20" font-weight="600" fill="#43546c" text-anchor="middle">当前执行身份</text>
<text x="192.0" y="441" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">角色与权限</text>
<text x="192.0" y="465" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">携带的授权边界</text>
<rect x="432" y="380" width="256" height="108" rx="6" fill="#f5f1fc" stroke="#b3a0d6" stroke-width="1.2"/>
<text x="560.0" y="411" font-size="20" font-weight="600" fill="#63448e" text-anchor="middle">统一授权求值</text>
<text x="560.0" y="441" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">角色授予取并集（OR）</text>
<text x="560.0" y="465" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">与执行边界求交（AND）</text>
<rect x="792" y="380" width="272" height="108" rx="6" fill="#effaf5" stroke="#78b59a" stroke-width="1.2"/>
<text x="928.0" y="411" font-size="20" font-weight="600" fill="#216149" text-anchor="middle">行范围解析</text>
<text x="928.0" y="441" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">普通字段 → 默认解析器</text>
<text x="928.0" y="465" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">$业务参数 → 对应插件</text>
<rect x="56" y="636" width="272" height="104" rx="6" fill="#ffffff" stroke="#b3bfce" stroke-width="1.2"/>
<text x="192.0" y="667" font-size="20" font-weight="600" fill="#43546c" text-anchor="middle">业务查询条件</text>
<text x="192.0" y="697" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">例如状态、时间等筛选</text>
<text x="192.0" y="721" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">与权限范围共同生效</text>
<rect x="432" y="636" width="256" height="104" rx="6" fill="#effaf5" stroke="#78b59a" stroke-width="1.2"/>
<text x="560.0" y="667" font-size="20" font-weight="600" fill="#216149" text-anchor="middle">数据操作插件</text>
<text x="560.0" y="697" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">业务条件 AND 行范围</text>
<text x="560.0" y="721" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">按字段范围限制读写</text>
<rect x="792" y="636" width="272" height="104" rx="6" fill="#ffffff" stroke="#b3bfce" stroke-width="1.2"/>
<text x="928.0" y="667" font-size="20" font-weight="600" fill="#43546c" text-anchor="middle">允许操作的数据</text>
<text x="928.0" y="697" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">范围内的记录</text>
<text x="928.0" y="721" font-size="16" font-weight="400" fill="#52657f" text-anchor="middle">允许读写的字段</text>
<text x="40" y="790" font-size="15" font-weight="400" fill="#667b94" text-anchor="start">权限绑定在数据操作链中生效；自定义数据路径也须执行相同的行、字段约束。</text>
</svg>
