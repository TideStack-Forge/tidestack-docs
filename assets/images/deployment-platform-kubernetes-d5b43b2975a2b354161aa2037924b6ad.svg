<rect x="40" y="1160" width="976" height="248" rx="6" fill="#fff" stroke="#b3bfce"/>
<text x="64" y="1196" font-size="14" font-weight="600" fill="#33455e">连接与挂载清单</text>
<text x="64" y="1236" font-size="12" font-weight="600" fill="#33455e">平台 → Kubernetes API Server</text>
<text x="368" y="1236" font-size="12" font-weight="400" fill="#596b83">HTTPS / 集群端点；创建 Deployment、Service、Ingress，读取状态</text>
<line x1="64" y1="1246" x2="992" y2="1246" stroke="#edf0f4"/>
<text x="64" y="1268" font-size="12" font-weight="600" fill="#33455e">平台 / 实例 → MySQL、RabbitMQ</text>
<text x="368" y="1268" font-size="12" font-weight="400" fill="#596b83">使用集群可达地址：TCP :3306 / AMQP :5672</text>
<line x1="64" y1="1278" x2="992" y2="1278" stroke="#edf0f4"/>
<text x="64" y="1300" font-size="12" font-weight="600" fill="#33455e">平台 → 共享文件存储</text>
<text x="368" y="1300" font-size="12" font-weight="400" fill="#596b83">在 mounted-workspace-root 挂载实例 PVC 对应的底层存储</text>
<line x1="64" y1="1310" x2="992" y2="1310" stroke="#edf0f4"/>
<text x="64" y="1332" font-size="12" font-weight="600" fill="#33455e">实例 PVC → 底层存储 → Pod</text>
<text x="368" y="1332" font-size="12" font-weight="400" fill="#596b83">测试应用使用 metadata / extend subPath；助手使用实例根 subPath</text>
<line x1="64" y1="1342" x2="992" y2="1342" stroke="#edf0f4"/>
<text x="64" y="1364" font-size="12" font-weight="600" fill="#33455e">公网 / 内网访问入口</text>
<text x="368" y="1364" font-size="12" font-weight="400" fill="#596b83">Controller + DNS + TLS 自备；NodePort 与 Ingress 细节见局部图</text>
<rect x="1040" y="1160" width="520" height="248" rx="6" fill="#fff9f0" stroke="#d5b78b"/>
<text x="1064" y="1196" font-size="14" font-weight="600" fill="#33455e">数量、规格与故障域</text>
<text x="1064" y="1236" font-size="12" font-weight="400" fill="#805d2e">图示平台 Pod ×1；每个运行实例 Pod ×1</text>
<text x="1064" y="1268" font-size="12" font-weight="400" fill="#805d2e">Service / Ingress 是逻辑资源，不是服务器</text>
<text x="1064" y="1300" font-size="12" font-weight="400" fill="#805d2e">集群 M、入口 G、DB / MQ 副本数未预设</text>
<text x="1064" y="1332" font-size="12" font-weight="400" fill="#805d2e">平台 ×1 为单点；多副本协调尚未验证</text>
<text x="1064" y="1364" font-size="12" font-weight="400" fill="#805d2e">requests / limits、PVC 容量与访问模式需明确</text>
