<text x="704.0" y="1177.0" font-size="18" font-weight="600" fill="#216149" text-anchor="middle">接口与业务动作</text>
<text x="704.0" y="1201.0" font-size="15" fill="#52657f" text-anchor="middle">后端授权检查</text>
</g>
