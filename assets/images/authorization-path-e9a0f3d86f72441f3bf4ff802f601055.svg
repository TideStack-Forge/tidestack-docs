<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 116 1400 1184" role="img" aria-labelledby="authorization-path-title authorization-path-desc">
<title id="authorization-path-title">身份与访问控制</title>
<desc id="authorization-path-desc">请求建立身份和凭据上下文，用户角色权限先并集；委托凭据再与授权范围取交集并校验目标资源，判定结果用于接口、业务操作与行列权限控制。</desc>
