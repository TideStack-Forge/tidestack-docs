<text x="220.0" y="434.0" font-size="20" font-weight="600" fill="#63448e" text-anchor="middle">角色授权集合</text>
<text x="220.0" y="458.0" font-size="15" fill="#52657f" text-anchor="middle">多个角色授予的权限先并集</text>
</g>
<g data-node="credentials"><rect x="560" y="380" width="280" height="112" rx="7" fill="#f5f1fc" stroke="#b3a0d6" stroke-width="1.3"/>
<text x="700.0" y="422.0" font-size="20" font-weight="600" fill="#63448e" text-anchor="middle">凭据类型与范围</text>
<text x="700.0" y="446.0" font-size="15" fill="#52657f" text-anchor="middle">平台会话</text>
<text x="700.0" y="470.0" font-size="15" fill="#52657f" text-anchor="middle">委托凭据及其授权范围</text>
</g>
<g data-node="rules"><rect x="1040" y="380" width="280" height="112" rx="7" fill="#fff7e9" stroke="#d4ad69" stroke-width="1.3"/>
<text x="1180.0" y="434.0" font-size="20" font-weight="600" fill="#805719" text-anchor="middle">目标资源约束</text>
<text x="1180.0" y="458.0" font-size="15" fill="#52657f" text-anchor="middle">资源一致性／是否允许委托</text>
</g>
<g data-node="evaluation"><rect x="420" y="620" width="560" height="144" rx="7" fill="#eef9fb" stroke="#7fb9c3" stroke-width="1.3"/>
<text x="700.0" y="663.5" font-size="21" font-weight="600" fill="#245e69" text-anchor="middle">统一授权判定</text>
<text x="700.0" y="689.5" font-size="17" fill="#52657f" text-anchor="middle">角色权限先并集</text>
<text x="700.0" y="715.5" font-size="17" fill="#52657f" text-anchor="middle">委托凭据再与授权范围取交集</text>
<text x="700.0" y="741.5" font-size="17" fill="#52657f" text-anchor="middle">平台会话采用用户角色授权</text>
</g>
<g data-node="denied"><rect x="80" y="916" width="360" height="104" rx="7" fill="#fff1ef" stroke="#d4a09a" stroke-width="1.3"/>
<text x="260.0" y="966.0" font-size="20" font-weight="600" fill="#8c453b" text-anchor="middle">拒绝访问</text>
<text x="260.0" y="990.0" font-size="15" fill="#52657f" text-anchor="middle">无权限／凭据无效／超出范围</text>
</g>
<g data-node="allowed"><rect x="600" y="916" width="720" height="104" rx="7" fill="#effaf5" stroke="#78b59a" stroke-width="1.3"/>
<text x="960.0" y="965.0" font-size="20" font-weight="600" fill="#216149" text-anchor="middle">访问许可与数据控制参数</text>
<text x="960.0" y="991.0" font-size="17" fill="#52657f" text-anchor="middle">允许的操作、行级过滤条件与列级字段权限</text>
</g>
<g data-node="menu"><rect x="80" y="1132" width="360" height="96" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
