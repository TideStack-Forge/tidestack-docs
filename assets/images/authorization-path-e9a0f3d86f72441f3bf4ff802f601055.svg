<text x="700.0" y="218.0" font-size="15" fill="#52657f" text-anchor="middle">用户身份、角色与凭据类型</text>
</g>
<g data-node="target"><rect x="1040" y="140" width="280" height="112" rx="7" fill="#fff7e9" stroke="#d4ad69" stroke-width="1.3"/>
<text x="1180.0" y="194.0" font-size="20" font-weight="600" fill="#805719" text-anchor="middle">目标权限资源</text>
