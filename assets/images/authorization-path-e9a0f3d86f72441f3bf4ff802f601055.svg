<text x="220.0" y="194.0" font-size="20" font-weight="600" fill="#204f86" text-anchor="middle">请求与令牌</text>
<text x="220.0" y="218.0" font-size="15" fill="#52657f" text-anchor="middle">HTTP／WebSocket 身份凭据</text>
</g>
<g data-node="identity"><rect x="560" y="140" width="280" height="112" rx="7" fill="#f5f1fc" stroke="#b3a0d6" stroke-width="1.3"/>
