<g data-node="identity"><rect x="32" y="24" width="280" height="104" rx="7" fill="#f5f7fa" stroke="#b3bfce" stroke-width="1.3"/>
<text x="172.0" y="60.0" font-size="22" font-weight="600" fill="#43546c" text-anchor="middle">当前身份与操作</text>
<text x="172.0" y="87.0" font-size="18" fill="#52657f" text-anchor="middle">用户、角色与凭据</text>
<text x="172.0" y="114.0" font-size="18" fill="#52657f" text-anchor="middle">目标模型及操作权限</text>
</g>
<g data-node="decision"><rect x="376" y="24" width="464" height="104" rx="7" fill="#f5f1fc" stroke="#b3a0d6" stroke-width="1.3"/>
<text x="608.0" y="73.5" font-size="22" font-weight="600" fill="#63448e" text-anchor="middle">匹配目标操作权限</text>
<text x="608.0" y="100.5" font-size="18" fill="#52657f" text-anchor="middle">只读取授予本次操作权限的角色配置</text>
</g>
<g data-node="grants"><rect x="904" y="24" width="344" height="104" rx="7" fill="#f5f7fa" stroke="#b3bfce" stroke-width="1.3"/>
<text x="1076.0" y="60.0" font-size="22" font-weight="600" fill="#43546c" text-anchor="middle">权限定义与角色授权</text>
<text x="1076.0" y="87.0" font-size="18" fill="#52657f" text-anchor="middle">可控制的字段与筛选维度</text>
<text x="1076.0" y="114.0" font-size="18" fill="#52657f" text-anchor="middle">角色授予的字段与数据范围</text>
</g>
<g data-node="row-resolve"><rect x="80" y="288" width="512" height="96" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
<text x="336.0" y="319.0" font-size="20" font-weight="600" fill="#204f86" text-anchor="middle">单个角色：解析筛选参数</text>
<text x="336.0" y="346.0" font-size="18" fill="#52657f" text-anchor="middle">固定取值／当前员工、部门、公司等范围</text>
<text x="336.0" y="373.0" font-size="18" fill="#52657f" text-anchor="middle">过滤器解析取值，各维度条件通过 AND 组合</text>
</g>
<g data-node="field-resolve"><rect x="688" y="288" width="512" height="96" rx="7" fill="#effaf5" stroke="#78b59a" stroke-width="1.3"/>
<text x="944.0" y="319.0" font-size="20" font-weight="600" fill="#216149" text-anchor="middle">单个角色：解析字段配置</text>
<text x="944.0" y="346.0" font-size="18" fill="#52657f" text-anchor="middle">按权限定义区分公共字段与受控字段</text>
<text x="944.0" y="373.0" font-size="18" fill="#52657f" text-anchor="middle">公共字段与获准的受控字段组成允许集</text>
</g>
<g data-node="rows"><rect x="80" y="424" width="512" height="128" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
<text x="336.0" y="457.5" font-size="20" font-weight="600" fill="#204f86" text-anchor="middle">行约束 · RowConstraint</text>
<text x="336.0" y="484.5" font-size="18" fill="#52657f" text-anchor="middle">ALL：全部记录　｜　FILTER：条件范围</text>
<text x="336.0" y="511.5" font-size="18" fill="#52657f" text-anchor="middle">NONE：无可访问记录</text>
<text x="336.0" y="538.5" font-size="18" fill="#52657f" text-anchor="middle">示例：部门 = A</text>
</g>
<g data-node="fields"><rect x="688" y="424" width="512" height="128" rx="7" fill="#effaf5" stroke="#78b59a" stroke-width="1.3"/>
<text x="944.0" y="457.5" font-size="20" font-weight="600" fill="#216149" text-anchor="middle">字段约束 · FieldConstraint</text>
<text x="944.0" y="484.5" font-size="18" fill="#52657f" text-anchor="middle">ALL：全部字段，可带排除字段</text>
<text x="944.0" y="511.5" font-size="18" fill="#52657f" text-anchor="middle">ONLY：指定字段　｜　NONE：无可用字段</text>
<text x="944.0" y="538.5" font-size="18" fill="#52657f" text-anchor="middle">示例：编号、部门、名称</text>
</g>
<g data-node="combine"><rect x="96" y="608" width="1088" height="144" rx="7" fill="#f5f1fc" stroke="#b3a0d6" stroke-width="1.3"/>
<text x="640.0" y="650.5" font-size="22" font-weight="600" fill="#63448e" text-anchor="middle">按同一操作权限组合行、列约束</text>
<text x="640.0" y="677.5" font-size="18" fill="#52657f" text-anchor="middle">多个角色：行范围取 OR，字段集合取并集</text>
<text x="640.0" y="704.5" font-size="18" fill="#52657f" text-anchor="middle">使用委托凭据时：再与凭据的行范围、字段集合分别取交集</text>
<text x="640.0" y="731.5" font-size="18" fill="#52657f" text-anchor="middle">无操作授权、凭据未包含目标权限等情况，直接拒绝</text>
</g>
<g data-node="read"><rect x="32" y="864" width="592" height="216" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
<text x="328.0" y="925.0" font-size="22" font-weight="600" fill="#204f86" text-anchor="middle">查询与统计</text>
<text x="328.0" y="954.0" font-size="20" fill="#52657f" text-anchor="middle">业务筛选条件 AND 行级条件</text>
<text x="328.0" y="983.0" font-size="20" fill="#52657f" text-anchor="middle">通配查询只选择获准字段</text>
<text x="328.0" y="1012.0" font-size="20" fill="#52657f" text-anchor="middle">筛选、排序、分组等引用的字段逐项校验</text>
<text x="328.0" y="1041.0" font-size="20" fill="#52657f" text-anchor="middle">显式请求未授权字段时拒绝执行</text>
</g>
<g data-node="write"><rect x="656" y="864" width="592" height="216" rx="7" fill="#effaf5" stroke="#78b59a" stroke-width="1.3"/>
<text x="952.0" y="925.0" font-size="22" font-weight="600" fill="#216149" text-anchor="middle">写入与删除</text>
<text x="952.0" y="954.0" font-size="20" fill="#52657f" text-anchor="middle">新增：检查写入字段与新记录范围</text>
<text x="952.0" y="983.0" font-size="20" fill="#52657f" text-anchor="middle">更新：限定目标行，检查写入字段</text>
<text x="952.0" y="1012.0" font-size="20" fill="#52657f" text-anchor="middle">修改受控维度时，新值仍须满足行级条件</text>
<text x="952.0" y="1041.0" font-size="20" fill="#52657f" text-anchor="middle">删除：只作用于获准的数据行</text>
</g>
<text x="640" y="832" font-size="18" fill="#52657f" text-anchor="middle" font-weight="600">数据模型访问控制插件执行约束</text>
<text x="952" y="1112" font-size="18" fill="#8c453b" text-anchor="middle">越权字段或不满足行级条件的写入会被拒绝</text>
<text x="32" y="1160" font-size="20" fill="#52657f" text-anchor="start" font-weight="600">查询效果示例：仅允许 A 部门，且仅允许读取“编号、部门、名称”三个字段。</text>
<text x="32" y="1200" font-size="20" fill="#52657f" text-anchor="start" font-weight="600">原始数据（示意）</text>
<text x="784" y="1200" font-size="20" fill="#204f86" text-anchor="start" font-weight="600">本次查询返回的数据</text>
<text x="704" y="1272" font-size="18" fill="#52657f" text-anchor="middle">按行筛选</text>
<text x="704" y="1300" font-size="18" fill="#52657f" text-anchor="middle">按列选择</text>
<text x="1016" y="1412" font-size="18" fill="#204f86" text-anchor="middle">B 部门记录、金额字段均不返回</text>
<text x="32" y="1472" font-size="18" fill="#52657f" text-anchor="start">控制在后端数据访问时执行；前端隐藏字段或按钮用于界面呈现，不能替代授权检查。</text>
