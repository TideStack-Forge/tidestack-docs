<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1504" width="1280" height="1504" role="img" aria-labelledby="row-and-column-access-control-title row-and-column-access-control-desc" id="row-and-column-access-control-root">
<title id="row-and-column-access-control-title">行级与列级数据访问控制</title>
<desc id="row-and-column-access-control-desc">角色授权分别解析为行级条件与字段集合，同一权限的多个角色取并集，委托凭据再限制其范围，数据模型访问控制插件据此约束查询、统计、写入与删除。</desc>
<defs>
      <style>#row-and-column-access-control-root { font-family: -apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif; }
      #row-and-column-access-control-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#row-and-column-access-control-root .diagram-container { overflow-x:visible }
}
      #row-and-column-access-control-root text { font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif }</style><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}</style>
