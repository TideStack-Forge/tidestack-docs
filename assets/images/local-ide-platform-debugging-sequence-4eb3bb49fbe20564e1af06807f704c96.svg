<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc">
<title id="title">本地 IDE 与平台测试实例联调</title>
<desc id="desc">本地打包后，IDE 向平台授权、上传扩展；平台重启实例并创建调试会话，IDE 经调试通道附加 JVM。浏览器触发业务后，断点信息返回 IDE，继续执行后实例响应业务请求。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<marker id="a547ba7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#547ba7" stroke-width="1.5"/></marker>
<marker id="a7b67a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7b67a8" stroke-width="1.5"/></marker>
<marker id="a3e8b76" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#3e8b76" stroke-width="1.5"/></marker>
</defs>
<rect width="1180" height="900" fill="#fff"/>
<text x="30" y="33.0" font-size="26" font-weight="600" fill="#273e59" text-anchor="start" dominant-baseline="central">本地 IDE 与平台测试实例联调</text>
<rect x="22" y="140" width="1136" height="210" rx="8" fill="#f3f7fc" stroke="#f3f7fc"/>
<text x="38" y="160.0" font-size="17" font-weight="600" fill="#547ba7" text-anchor="start" dominant-baseline="central">部署与装配</text>
<rect x="22" y="370" width="1136" height="210" rx="8" fill="#f7f3fc" stroke="#f7f3fc"/>
<text x="38" y="390.0" font-size="17" font-weight="600" fill="#7b67a8" text-anchor="start" dominant-baseline="central">建立调试连接</text>
<rect x="22" y="600" width="1136" height="230" rx="8" fill="#f0f8f5" stroke="#f0f8f5"/>
<text x="38" y="620.0" font-size="17" font-weight="600" fill="#3e8b76" text-anchor="start" dominant-baseline="central">触发业务与断点</text>
<line x1="150" y1="120" x2="150" y2="830" stroke="#bdc8d5" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="42" y="65" width="216" height="55" rx="8" fill="#eef5ff" stroke="#8eafe0"/>
<text x="150.0" y="92.0" font-size="20" font-weight="600" fill="#33465f" text-anchor="middle" dominant-baseline="central">本地 IDE</text>
<line x1="450" y1="120" x2="450" y2="830" stroke="#bdc8d5" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="342" y="65" width="216" height="55" rx="8" fill="#f3effb" stroke="#b6a2d8"/>
<text x="450.0" y="92.0" font-size="20" font-weight="600" fill="#33465f" text-anchor="middle" dominant-baseline="central">开发平台</text>
<line x1="750" y1="120" x2="750" y2="830" stroke="#bdc8d5" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="642" y="65" width="216" height="55" rx="8" fill="#edf8f3" stroke="#80b59e"/>
<text x="750.0" y="92.0" font-size="20" font-weight="600" fill="#33465f" text-anchor="middle" dominant-baseline="central">测试运行实例</text>
<line x1="1050" y1="120" x2="1050" y2="830" stroke="#bdc8d5" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="942" y="65" width="216" height="55" rx="8" fill="#f4f6f9" stroke="#b9c4d2"/>
<text x="1050.0" y="92.0" font-size="20" font-weight="600" fill="#33465f" text-anchor="middle" dominant-baseline="central">浏览器 / API 客户端</text>
<rect x="55" y="176" width="190" height="38" rx="8" fill="#ffffff" stroke="#b2c5dd"/>
<text x="150.0" y="194.0" font-size="18" font-weight="400" fill="#33465f" text-anchor="middle" dominant-baseline="central">本地打包当前扩展</text>
<line x1="150" y1="242" x2="450" y2="242" stroke="#547ba7" stroke-width="1.5" marker-end="url(#a547ba7)"/>
<text x="300.0" y="221.0" font-size="19" font-weight="400" fill="#547ba7" text-anchor="middle" dominant-baseline="central">授权并定位测试实例</text>
<line x1="150" y1="290" x2="450" y2="290" stroke="#547ba7" stroke-width="1.5" marker-end="url(#a547ba7)"/>
<text x="300.0" y="269.0" font-size="19" font-weight="400" fill="#547ba7" text-anchor="middle" dominant-baseline="central">上传扩展 JAR</text>
<line x1="450" y1="338" x2="750" y2="338" stroke="#547ba7" stroke-width="1.5" marker-end="url(#a547ba7)"/>
<text x="600.0" y="317.0" font-size="19" font-weight="400" fill="#547ba7" text-anchor="middle" dominant-baseline="central">重启并加载扩展与元数据</text>
<line x1="150" y1="420" x2="450" y2="420" stroke="#7b67a8" stroke-width="1.5" marker-end="url(#a7b67a8)"/>
<text x="300.0" y="399.0" font-size="19" font-weight="400" fill="#7b67a8" text-anchor="middle" dominant-baseline="central">创建调试会话</text>
<line x1="450" y1="472" x2="150" y2="472" stroke="#7b67a8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a7b67a8)"/>
<text x="300.0" y="451.0" font-size="19" font-weight="400" fill="#7b67a8" text-anchor="middle" dominant-baseline="central">返回调试入口 host:port</text>
<line x1="150" y1="548" x2="750" y2="548" stroke="#7b67a8" stroke-width="1.5" marker-end="url(#a7b67a8)"/>
<text x="450.0" y="527.0" font-size="19" font-weight="400" fill="#7b67a8" text-anchor="middle" dominant-baseline="central">JDWP 附加（开发平台调试通道转发）</text>
<line x1="1050" y1="668" x2="750" y2="668" stroke="#3e8b76" stroke-width="1.5" marker-end="url(#a3e8b76)"/>
<text x="900.0" y="647.0" font-size="19" font-weight="400" fill="#3e8b76" text-anchor="middle" dominant-baseline="central">发起页面操作或 API 请求</text>
<line x1="750" y1="729" x2="150" y2="729" stroke="#7b67a8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a7b67a8)"/>
<text x="450.0" y="708.0" font-size="19" font-weight="400" fill="#7b67a8" text-anchor="middle" dominant-baseline="central">断点、变量与单步（经 JDWP 通道）</text>
<line x1="750" y1="794" x2="1050" y2="794" stroke="#3e8b76" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a3e8b76)"/>
<text x="900.0" y="773.0" font-size="19" font-weight="400" fill="#3e8b76" text-anchor="middle" dominant-baseline="central">继续执行后返回业务响应</text>
<text x="30" y="867.0" font-size="17" font-weight="400" fill="#667b94" text-anchor="start" dominant-baseline="central">管理入口、业务入口和 JDWP 入口分别连接；本地源码须与测试实例中的扩展 JAR 一致。</text>
</svg>