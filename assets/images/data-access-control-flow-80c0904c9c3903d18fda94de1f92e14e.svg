<path d="M928 228L928 372" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-627ba4)" class="diagram-link-blue" />
<path d="M336 434L424 434" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)" class="diagram-line" />
<path d="M784 434L696 434" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-43816c)" class="diagram-link-teal" />
<path d="M560 496L560 628" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-9577b5)" class="diagram-link-violet" />
<path d="M336 688L424 688" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)" class="diagram-line" />
<path d="M696 688L784 688" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-43816c)" class="diagram-link-teal" />
<text x="536" y="276" font-size="15" font-weight="400" text-anchor="start" class="diagram-muted">参数定义</text>
<text x="944" y="292" font-size="15" font-weight="400" text-anchor="start" class="diagram-muted">保存值</text>
<text x="576" y="562" font-size="15" font-weight="400" text-anchor="start" class="diagram-muted">最终行范围与字段范围</text>
<rect x="56" y="116" width="272" height="104" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" />
<text x="192.0" y="147" font-size="20" font-weight="600" text-anchor="middle" class="diagram-label-blue">权限参数定义</text>
<text x="192.0" y="177" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">字段、范围参数与授权控件</text>
<text x="192.0" y="201" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">AccessControlDefine</text>
<rect x="432" y="116" width="256" height="104" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" />
<text x="560.0" y="147" font-size="20" font-weight="600" text-anchor="middle" class="diagram-label-blue">角色授权界面</text>
<text x="560.0" y="177" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">根据定义显示配置控件</text>
<text x="560.0" y="201" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">管理员选择数据范围</text>
<rect x="792" y="116" width="272" height="104" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" />
<text x="928.0" y="147" font-size="20" font-weight="600" text-anchor="middle" class="diagram-label-blue">角色参数值</text>
<text x="928.0" y="177" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">regionCode = A</text>
<text x="928.0" y="201" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">amount.$gte = 100</text>
<rect x="56" y="380" width="272" height="108" rx="8" stroke-width="1" class="diagram-paper diagram-border-neutral" />
<text x="192.0" y="411" font-size="20" font-weight="600" text-anchor="middle" class="diagram-muted">当前执行身份</text>
<text x="192.0" y="441" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">角色与权限</text>
<text x="192.0" y="465" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">携带的授权边界</text>
<rect x="432" y="380" width="256" height="108" rx="8" stroke-width="1" class="diagram-surface-violet diagram-border-violet diagram-wash-violet" />
<text x="560.0" y="411" font-size="20" font-weight="600" text-anchor="middle" class="diagram-label-violet">统一授权求值</text>
<text x="560.0" y="441" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">角色授予取并集（OR）</text>
<text x="560.0" y="465" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">与执行边界求交（AND）</text>
<rect x="792" y="380" width="272" height="108" rx="8" stroke-width="1" class="diagram-surface-teal diagram-border-teal diagram-wash-teal" />
<text x="928.0" y="411" font-size="20" font-weight="600" text-anchor="middle" class="diagram-label-teal">行范围解析</text>
<text x="928.0" y="441" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">普通字段 → 默认解析器</text>
<text x="928.0" y="465" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">$业务参数 → 对应插件</text>
<rect x="56" y="636" width="272" height="104" rx="8" stroke-width="1" class="diagram-paper diagram-border-neutral" />
<text x="192.0" y="667" font-size="20" font-weight="600" text-anchor="middle" class="diagram-muted">业务查询条件</text>
<text x="192.0" y="697" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">例如状态、时间等筛选</text>
<text x="192.0" y="721" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">与权限范围共同生效</text>
<rect x="432" y="636" width="256" height="104" rx="8" stroke-width="1" class="diagram-surface-teal diagram-border-teal diagram-wash-teal" />
<text x="560.0" y="667" font-size="20" font-weight="600" text-anchor="middle" class="diagram-label-teal">数据操作插件</text>
<text x="560.0" y="697" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">业务条件 AND 行范围</text>
<text x="560.0" y="721" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">按字段范围限制读写</text>
<rect x="792" y="636" width="272" height="104" rx="8" stroke-width="1" class="diagram-paper diagram-border-neutral" />
<text x="928.0" y="667" font-size="20" font-weight="600" text-anchor="middle" class="diagram-muted">允许操作的数据</text>
<text x="928.0" y="697" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">范围内的记录</text>
<text x="928.0" y="721" font-size="16" font-weight="400" text-anchor="middle" class="diagram-muted">允许读写的字段</text>
<text x="40" y="790" font-size="15" font-weight="400" text-anchor="start" class="diagram-muted">权限绑定在数据操作链中生效；自定义数据路径也须执行相同的行、字段约束。</text>
</svg>