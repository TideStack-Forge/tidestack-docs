</defs>
<rect width="1120" height="800" class="diagram-canvas" x="0" y="0" />
<text x="40" y="38" font-size="24" font-weight="600" text-anchor="start" class="diagram-ink">数据权限参数的生效过程</text>
<rect x="32" y="72" width="1056" height="172" rx="8" stroke-width="1" class="diagram-surface-neutral diagram-border-neutral diagram-wash-neutral" />
<text x="48" y="97" font-size="16" font-weight="600" text-anchor="start" class="diagram-muted">01  定义与授权</text>
<rect x="32" y="336" width="1056" height="176" rx="8" stroke-width="1" class="diagram-surface-neutral diagram-border-neutral diagram-wash-neutral" />
<text x="48" y="361" font-size="16" font-weight="600" text-anchor="start" class="diagram-muted">02  授权求值</text>
<rect x="32" y="592" width="1056" height="172" rx="8" stroke-width="1" class="diagram-surface-neutral diagram-border-neutral diagram-wash-neutral" />
<text x="48" y="617" font-size="16" font-weight="600" text-anchor="start" class="diagram-muted">03  数据执行</text>
<path d="M336 168L424 168" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)" class="diagram-line" />
<path d="M696 168L784 168" fill="none" stroke-width="1.5" marker-end="url(#data-access-control-flow-arrow-71839a)" class="diagram-line" />
