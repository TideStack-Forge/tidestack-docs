<svg xmlns="http://www.w3.org/2000/svg" width="960" height="808" viewBox="0 0 960 808" role="img" aria-labelledby="model-relations-webapi-title model-relations-webapi-desc" id="model-relations-webapi-root"><title id="model-relations-webapi-title">Web 接口与逻辑流能力</title><desc id="model-relations-webapi-desc">WebAPI 绑定逻辑流，逻辑流通过节点调用数据模型、其他逻辑流、审批流、从属集合、业务事件、RPC、MQ、消息通知、统一配置与访问控制。</desc><defs>
