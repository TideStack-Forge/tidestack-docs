<text x="700.0" y="715.5" font-size="17" text-anchor="middle" class="diagram-muted">委托凭据再与授权范围取交集</text>
<text x="700.0" y="741.5" font-size="17" text-anchor="middle" class="diagram-muted">平台会话采用用户角色授权</text>
</g>
