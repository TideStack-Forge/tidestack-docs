  <text x="1210" y="144" class="legend-title diagram-muted">应用生命周期</text>
  <text x="1210" y="174" class="legend-text"><tspan x="1210" dy="0">需求进入建模，模型经过构建、</tspan><tspan x="1210" dy="23">验证和交付进入运行，</tspan></text><text x="1210" y="220" class="legend-text">运行反馈推动下一轮演进。</text>
  <text x="1210" y="364" class="legend-title diagram-label-blue">投影模型</text>
  <text x="1210" y="394" class="legend-text">分别承接数据、页面、接口、流程、集成、</text><text x="1210" y="417" class="legend-text">导航与权限职责。</text>
  <text x="1210" y="614" class="legend-title diagram-label-orange">业务与治理要素</text>
  <text x="1210" y="644" class="legend-text">定义对象的属性、关系、动作和事件，</text><text x="1210" y="667" class="legend-text">以及谁可以访问。</text>
</svg>