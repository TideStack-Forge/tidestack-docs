  <g><rect class="pill diagram-border-blue diagram-wash-blue" x="866" y="616" width="100" height="40" rx="8" /><text x="916" y="642" class="model-text">审批流</text></g>
  <g><rect class="pill diagram-border-blue diagram-wash-blue" x="695" y="685" width="110" height="40" rx="8" /><text x="750" y="711" class="model-text">菜单模型</text></g>
