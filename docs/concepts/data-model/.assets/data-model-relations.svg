<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" width="960" height="688" role="img" aria-labelledby="data-model-relations-title data-model-relations-desc" id="data-model-relations-root">
<title id="data-model-relations-title">关联键与关联填充</title>
<desc id="data-model-relations-desc">资产通过 departmentId 关联部门的 id；按需填充后，资产查询返回单个部门对象，部门查询返回资产集合。</desc>
<defs>
      <style>#data-model-relations-root .diagram-container { width:100%;overflow-x:auto }
      #data-model-relations-root text { font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif }</style><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}</style>
