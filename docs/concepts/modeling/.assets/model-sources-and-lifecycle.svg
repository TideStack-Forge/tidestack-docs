<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="sources-title sources-desc" class="ts-diagram">
  <title id="sources-title">模型来源与生效阶段</title>
  <desc id="sources-desc">模型来源分为平台能力与扩展、应用定义与资源、特定能力中的受管自定义定义；模型进入系统后依次经历定义或编码、版本或打包、启动或加载、运行或刷新等阶段。</desc>
  <defs><style id="handbook-diagram-theme">/* TideStack diagram theme: approved against the live site's colors and style samples.
 * Embedded with gradients by scripts/sync-diagram-styles.mjs for offline images.
 * External SVGs follow the embedding image's color-scheme preference.
 */
.ts-diagram {
  --diagram-canvas: #f8fafc;
  --diagram-paper: #ffffff;
  --diagram-ink: #0f172a;
  --diagram-muted: #526176;
  --diagram-rule: #e2e8f0;
  --diagram-on-solid: #ffffff;
  --diagram-neutral-surface: #f3f6fa;
  --diagram-neutral-rule: #d5dee9;
  --diagram-neutral-ink: #475569;
  --diagram-blue-surface: #f1f6fc;
  --diagram-blue-rule: #ceddec;
  --diagram-blue-ink: #285988;
  --diagram-teal-surface: #eff9f7;
  --diagram-teal-rule: #c0ded7;
  --diagram-teal-ink: #176b65;
  --diagram-sky-surface: #f0f8fc;
  --diagram-sky-rule: #c8e0eb;
  --diagram-sky-ink: #28667e;
  --diagram-violet-surface: #f7f4fb;
  --diagram-violet-rule: #ddd3eb;
  --diagram-violet-ink: #6b548c;
  --diagram-indigo-surface: #f5f5fb;
  --diagram-indigo-rule: #d6d8eb;
  --diagram-indigo-ink: #565d8a;
  --diagram-rose-surface: #fcf4f7;
  --diagram-rose-rule: #ead2dd;
  --diagram-rose-ink: #91546f;
  --diagram-orange-surface: #fcf8f0;
  --diagram-orange-rule: #e8dac0;
  --diagram-orange-ink: #896336;
  --diagram-font: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  fill: var(--diagram-ink);
  background: var(--diagram-canvas);
}

@media (prefers-color-scheme: dark) {
  .ts-diagram {
    --diagram-canvas: #06080c;
    --diagram-paper: #0b0f17;
    --diagram-ink: #f8fafc;
    --diagram-muted: #a4b1c3;
    --diagram-rule: #273344;
    --diagram-on-solid: #0b0f17;
    --diagram-neutral-surface: #111827;
    --diagram-neutral-rule: #2b3749;
    --diagram-neutral-ink: #becada;
    --diagram-blue-surface: #121f30;
    --diagram-blue-rule: #2d435d;
    --diagram-blue-ink: #a9c9ee;
    --diagram-teal-surface: #102725;
    --diagram-teal-rule: #2c504a;
    --diagram-teal-ink: #94d6c9;
    --diagram-sky-surface: #11232e;
    --diagram-sky-rule: #2b4c5e;
    --diagram-sky-ink: #a1d0e3;
    --diagram-violet-surface: #221c30;
    --diagram-violet-rule: #473957;
    --diagram-violet-ink: #cdb8e5;
    --diagram-indigo-surface: #1e2032;
    --diagram-indigo-rule: #3e425f;
    --diagram-indigo-ink: #bfc3e9;
    --diagram-rose-surface: #2b1c27;
    --diagram-rose-rule: #573a4b;
    --diagram-rose-ink: #e1b1c6;
    --diagram-orange-surface: #2b2318;
    --diagram-orange-rule: #574732;
    --diagram-orange-ink: #e3c495;
  }
}

.ts-diagram text { font-family: var(--diagram-font); }
.ts-diagram .diagram-paper { fill: var(--diagram-paper); }
.ts-diagram .diagram-ink { fill: var(--diagram-ink); }
.ts-diagram .diagram-muted { fill: var(--diagram-muted); }
.ts-diagram .diagram-on-solid { fill: var(--diagram-on-solid); }
.ts-diagram .diagram-border { stroke: var(--diagram-rule); }
.ts-diagram .diagram-paper-border { stroke: var(--diagram-paper); }
.ts-diagram .diagram-line { stroke: var(--diagram-muted); }

.ts-diagram .diagram-surface-neutral { fill: var(--diagram-neutral-surface); }
.ts-diagram .diagram-border-neutral { stroke: var(--diagram-neutral-rule); }
.ts-diagram .diagram-label-neutral { fill: var(--diagram-neutral-ink); }
.ts-diagram .diagram-link-neutral { stroke: var(--diagram-neutral-ink); }
.ts-diagram .diagram-stop-neutral { stop-color: var(--diagram-neutral-surface); }

.ts-diagram .diagram-surface-blue { fill: var(--diagram-blue-surface); }
.ts-diagram .diagram-border-blue { stroke: var(--diagram-blue-rule); }
.ts-diagram .diagram-label-blue { fill: var(--diagram-blue-ink); }
.ts-diagram .diagram-link-blue { stroke: var(--diagram-blue-ink); }
.ts-diagram .diagram-stop-blue { stop-color: var(--diagram-blue-surface); }

.ts-diagram .diagram-surface-teal { fill: var(--diagram-teal-surface); }
.ts-diagram .diagram-border-teal { stroke: var(--diagram-teal-rule); }
.ts-diagram .diagram-label-teal { fill: var(--diagram-teal-ink); }
.ts-diagram .diagram-link-teal { stroke: var(--diagram-teal-ink); }
.ts-diagram .diagram-stop-teal { stop-color: var(--diagram-teal-surface); }

.ts-diagram .diagram-surface-sky { fill: var(--diagram-sky-surface); }
.ts-diagram .diagram-border-sky { stroke: var(--diagram-sky-rule); }
.ts-diagram .diagram-label-sky { fill: var(--diagram-sky-ink); }
.ts-diagram .diagram-link-sky { stroke: var(--diagram-sky-ink); }
.ts-diagram .diagram-stop-sky { stop-color: var(--diagram-sky-surface); }

.ts-diagram .diagram-surface-violet { fill: var(--diagram-violet-surface); }
.ts-diagram .diagram-border-violet { stroke: var(--diagram-violet-rule); }
.ts-diagram .diagram-label-violet { fill: var(--diagram-violet-ink); }
.ts-diagram .diagram-link-violet { stroke: var(--diagram-violet-ink); }
.ts-diagram .diagram-stop-violet { stop-color: var(--diagram-violet-surface); }

.ts-diagram .diagram-surface-indigo { fill: var(--diagram-indigo-surface); }
.ts-diagram .diagram-border-indigo { stroke: var(--diagram-indigo-rule); }
.ts-diagram .diagram-label-indigo { fill: var(--diagram-indigo-ink); }
.ts-diagram .diagram-link-indigo { stroke: var(--diagram-indigo-ink); }
.ts-diagram .diagram-stop-indigo { stop-color: var(--diagram-indigo-surface); }

.ts-diagram .diagram-surface-rose { fill: var(--diagram-rose-surface); }
.ts-diagram .diagram-border-rose { stroke: var(--diagram-rose-rule); }
.ts-diagram .diagram-label-rose { fill: var(--diagram-rose-ink); }
.ts-diagram .diagram-link-rose { stroke: var(--diagram-rose-ink); }
.ts-diagram .diagram-stop-rose { stop-color: var(--diagram-rose-surface); }

.ts-diagram .diagram-surface-orange { fill: var(--diagram-orange-surface); }
.ts-diagram .diagram-border-orange { stroke: var(--diagram-orange-rule); }
.ts-diagram .diagram-label-orange { fill: var(--diagram-orange-ink); }
.ts-diagram .diagram-link-orange { stroke: var(--diagram-orange-ink); }
.ts-diagram .diagram-stop-orange { stop-color: var(--diagram-orange-surface); }

.ts-diagram .diagram-icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}


.ts-diagram .diagram-canvas { fill: var(--diagram-canvas); }
.ts-diagram .diagram-shell,
.ts-diagram .diagram-card { fill: var(--diagram-paper); stroke: var(--diagram-rule); }
.ts-diagram .diagram-icon-plate {
  fill: var(--diagram-paper);
  stroke: var(--diagram-rule);
  stroke-width: 1;
}
.ts-diagram .diagram-texture {
  fill: url(#handbook-rail-dots);
  stroke: none;
  opacity: .12;
  pointer-events: none;
}
.ts-diagram .diagram-lifeline { opacity: .5; }
.ts-diagram .diagram-wash-neutral { fill: url(#handbook-wash-neutral); }
.ts-diagram .diagram-wash-blue { fill: url(#handbook-wash-blue); }
.ts-diagram .diagram-wash-teal { fill: url(#handbook-wash-teal); }
.ts-diagram .diagram-wash-sky { fill: url(#handbook-wash-sky); }
.ts-diagram .diagram-wash-violet { fill: url(#handbook-wash-violet); }
.ts-diagram .diagram-wash-indigo { fill: url(#handbook-wash-indigo); }
.ts-diagram .diagram-wash-rose { fill: url(#handbook-wash-rose); }
.ts-diagram .diagram-wash-orange { fill: url(#handbook-wash-orange); }
</style><defs id="handbook-diagram-fills"><linearGradient id="handbook-wash-neutral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-neutral-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><linearGradient id="handbook-wash-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-blue-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><linearGradient id="handbook-wash-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-teal-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><linearGradient id="handbook-wash-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-sky-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><linearGradient id="handbook-wash-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-violet-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><linearGradient id="handbook-wash-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-indigo-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><linearGradient id="handbook-wash-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-rose-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><linearGradient id="handbook-wash-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--diagram-orange-surface)"/><stop offset="1" stop-color="var(--diagram-paper)"/></linearGradient><pattern id="handbook-rail-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".6" fill="var(--diagram-muted)"/></pattern></defs>
    <marker id="phase-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="diagram-muted" /></marker>
    <style>
      text { font-family:var(--diagram-font); }
      .heading { fill:var(--diagram-ink); font-size: 20px; font-weight:600; }
      .phase-title { fill:var(--diagram-ink); font-size: 17px; font-weight:600; text-anchor: middle; }
      .phase-subtitle { fill:var(--diagram-muted); font-size: 14px; text-anchor: middle; }
      .row-title { fill:var(--diagram-ink); font-size: 18px; font-weight:600; }
      .row-subtitle { fill:var(--diagram-muted); font-size: 14px; }
      .cell-text { font-size: 15px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1400" height="720" class="diagram-canvas" x="0" y="0" />
  <text x="40" y="62" class="heading">来源与治理边界</text>
  <text x="860" y="62" class="heading" text-anchor="middle">进入系统后的生效阶段</text>

  <g><rect x="390" y="90" width="205" height="70" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" /><text x="493" y="119" class="phase-title">定义 / 编码</text><text x="493" y="143" class="phase-subtitle">形成模型或扩展契约</text></g>
  <g><rect x="625" y="90" width="205" height="70" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" /><text x="728" y="119" class="phase-title">版本 / 打包</text><text x="728" y="143" class="phase-subtitle">形成可交付资产</text></g>
  <g><rect x="860" y="90" width="205" height="70" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" /><text x="963" y="119" class="phase-title">启动 / 加载</text><text x="963" y="143" class="phase-subtitle">发现、校验与装配</text></g>
  <g><rect x="1095" y="90" width="235" height="70" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" /><text x="1213" y="119" class="phase-title">运行 / 刷新</text><text x="1213" y="143" class="phase-subtitle">解释、执行或按契约刷新</text></g>
  <path d="M595 125H625" stroke-width="1.5" marker-end="url(#phase-arrow)" class="diagram-line" /><path d="M830 125H860" stroke-width="1.5" marker-end="url(#phase-arrow)" class="diagram-line" /><path d="M1065 125H1095" stroke-width="1.5" marker-end="url(#phase-arrow)" class="diagram-line" />

  <g><rect x="40" y="205" width="300" height="110" rx="8" stroke-width="1" class="diagram-surface-blue diagram-border-blue diagram-wash-blue" /><text x="62" y="243" class="row-title">平台能力与扩展</text><text x="62" y="271" class="row-subtitle">Java 类型、注解、自动配置、SPI、</text><text x="62" y="293" class="row-subtitle">JAR 元数据</text></g>
  <g><rect x="390" y="225" width="205" height="56" rx="8" class="diagram-paper diagram-border-blue" /><text x="493" y="259" class="cell-text diagram-label-blue">定义稳定契约与实现</text></g>
  <g><rect x="625" y="225" width="205" height="56" rx="8" class="diagram-paper diagram-border-blue" /><text x="728" y="259" class="cell-text diagram-label-blue">编译进入程序包</text></g>
  <g><rect x="860" y="225" width="205" height="56" rx="8" class="diagram-paper diagram-border-blue" /><text x="963" y="259" class="cell-text diagram-label-blue">启动期发现与装配</text></g>
  <g><rect x="1095" y="225" width="235" height="56" rx="8" class="diagram-paper diagram-border-blue" /><text x="1213" y="259" class="cell-text diagram-label-blue">作为引擎或扩展执行</text></g>

  <g><rect x="40" y="355" width="300" height="110" rx="8" stroke-width="1" class="diagram-surface-teal diagram-border-teal diagram-wash-teal" /><text x="62" y="393" class="row-title">应用定义与资源</text><text x="62" y="421" class="row-subtitle">工作区文件、模型元数据、扩展资源</text></g>
  <g><rect x="390" y="375" width="205" height="56" rx="8" class="diagram-paper diagram-border-teal" /><text x="493" y="409" class="cell-text diagram-label-teal">在设计时定义与校验</text></g>
  <g><rect x="625" y="375" width="205" height="56" rx="8" class="diagram-paper diagram-border-teal" /><text x="728" y="409" class="cell-text diagram-label-teal">进入应用版本</text></g>
  <g><rect x="860" y="375" width="205" height="56" rx="8" class="diagram-paper diagram-border-teal" /><text x="963" y="409" class="cell-text diagram-label-teal">由统一运行时基座加载</text></g>
  <g><rect x="1095" y="375" width="235" height="56" rx="8" class="diagram-paper diagram-border-teal" /><text x="1213" y="400" class="cell-text diagram-label-teal">装配执行；部分模型</text><text x="1213" y="420" class="cell-text diagram-label-teal">按生命周期刷新</text></g>

  <g><rect x="40" y="505" width="300" height="110" rx="8" stroke-width="1" class="diagram-surface-orange diagram-border-orange diagram-wash-orange" /><text x="62" y="543" class="row-title">受管自定义定义</text><text x="62" y="571" class="row-subtitle">特定能力的数据库化管理数据</text></g>
  <g><rect x="390" y="525" width="205" height="56" rx="8" class="diagram-paper diagram-border-orange" /><text x="493" y="559" class="cell-text diagram-label-orange">通过对应管理功能维护</text></g>
  <g><rect x="625" y="525" width="205" height="56" rx="8" class="diagram-paper diagram-border-orange" /><text x="728" y="550" class="cell-text diagram-label-orange">由该能力管理持久化</text><text x="728" y="570" class="cell-text diagram-label-orange">与版本边界</text></g>
  <g><rect x="860" y="525" width="205" height="56" rx="8" class="diagram-paper diagram-border-orange" /><text x="963" y="550" class="cell-text diagram-label-orange">由专用 Provider</text><text x="963" y="570" class="cell-text diagram-label-orange">投影到运行时</text></g>
  <g><rect x="1095" y="525" width="235" height="56" rx="8" class="diagram-paper diagram-border-orange" /><text x="1213" y="550" class="cell-text diagram-label-orange">按对应能力的启停</text><text x="1213" y="570" class="cell-text diagram-label-orange">与刷新规则生效</text></g>

  <rect x="205" y="655" width="990" height="48" rx="8" class="diagram-surface-neutral diagram-border-neutral diagram-wash-neutral" />
  <text x="700" y="685" font-size="16" text-anchor="middle" class="diagram-ink">来源决定模型由谁定义和如何治理；阶段决定模型何时被发现、装载与执行。两者不能混为同一分类。</text>
</svg>