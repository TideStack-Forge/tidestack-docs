<svg viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">元数据分层加载</title>
  <desc id="desc">基座层、插件层、低代码层和运行层都可以定义元数据。平台按标识和优先级叠加四层定义，形成当前环境中的最终生效定义。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0b63ce"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:20px;font-weight:650;fill:#0b1f3a}
      .sub{font-size:15px;fill:#52657f}
      .tag{font-size:14px;font-weight:600;text-anchor:middle}
      .side{font-size:15px;font-weight:600;fill:#0b63ce;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>

  <rect x="80" y="565" width="800" height="90" rx="12" fill="#f3f7fd" stroke="#7aa7de" stroke-width="2"/>
  <text x="120" y="600" class="title">基座层</text>
  <text x="120" y="630" class="sub">平台内置的默认模型、页面、菜单与基础能力</text>
  <rect x="680" y="586" width="155" height="46" rx="8" fill="#fff" stroke="#7aa7de"/>
  <text x="758" y="614" class="tag" fill="#264a73">默认定义</text>

  <rect x="80" y="455" width="800" height="90" rx="12" fill="#f0faf7" stroke="#54a89b" stroke-width="2"/>
  <text x="120" y="490" class="title">插件层</text>
  <text x="120" y="520" class="sub">追加字段类型、组件、流程节点与系统适配能力</text>
  <rect x="680" y="476" width="155" height="46" rx="8" fill="#fff" stroke="#54a89b"/>
  <text x="758" y="504" class="tag" fill="#285d54">可复用扩展</text>

  <rect x="80" y="345" width="800" height="90" rx="12" fill="#fff8ec" stroke="#d29a47" stroke-width="2"/>
  <text x="120" y="380" class="title">低代码层</text>
  <text x="120" y="410" class="sub">保存应用建模和配置产生的新增与调整内容</text>
  <rect x="680" y="366" width="155" height="46" rx="8" fill="#fff" stroke="#d29a47"/>
  <text x="758" y="394" class="tag" fill="#72531f">应用差异</text>

  <rect x="80" y="235" width="800" height="90" rx="12" fill="#eaf3ff" stroke="#0b63ce" stroke-width="2.5"/>
  <text x="120" y="270" class="title">运行层</text>
  <text x="120" y="300" class="sub">补充或覆盖与运行环境、实例相关的元数据</text>
  <rect x="680" y="256" width="155" height="46" rx="8" fill="#fff" stroke="#0b63ce" stroke-width="1.5"/>
  <text x="758" y="284" class="tag" fill="#0b63ce">运行时定义</text>

  <path d="M965 620V72" fill="none" stroke="#0b63ce" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="965" cy="610" r="5" fill="#0b63ce"/>
  <circle cx="965" cy="500" r="5" fill="#0b63ce"/>
  <circle cx="965" cy="390" r="5" fill="#0b63ce"/>
  <circle cx="965" cy="280" r="5" fill="#0b63ce"/>
  <text x="1020" y="270" class="side">
    <tspan x="1020" dy="0">按</tspan><tspan x="1020" dy="20">标</tspan><tspan x="1020" dy="20">识</tspan><tspan x="1020" dy="20">与</tspan><tspan x="1020" dy="20">优</tspan><tspan x="1020" dy="20">先</tspan><tspan x="1020" dy="20">级</tspan><tspan x="1020" dy="20">逐</tspan><tspan x="1020" dy="20">层</tspan><tspan x="1020" dy="20">叠</tspan><tspan x="1020" dy="20">加</tspan>
  </text>

  <rect x="80" y="30" width="800" height="150" rx="14" fill="#fbfcfe" stroke="#8b95a7" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="120" y="68" class="title">最终生效模型</text>
  <path d="M430 105H540M600 85H650M600 125H650" fill="none" stroke="#687386" stroke-width="2"/>
  <rect x="280" y="72" width="150" height="66" rx="9" fill="#eaf3ff" stroke="#0b63ce" stroke-width="2"/>
  <text x="355" y="112" class="tag" fill="#0b1f3a">业务模型</text>
  <rect x="540" y="54" width="60" height="54" rx="8" fill="#fff" stroke="#7aa7de"/>
  <text x="570" y="86" class="tag" fill="#264a73">数据</text>
  <rect x="650" y="54" width="60" height="54" rx="8" fill="#fff" stroke="#54a89b"/>
  <text x="680" y="86" class="tag" fill="#285d54">页面</text>
  <rect x="540" y="112" width="60" height="54" rx="8" fill="#fff" stroke="#7aa7de"/>
  <text x="570" y="144" class="tag" fill="#264a73">接口</text>
  <rect x="650" y="112" width="60" height="54" rx="8" fill="#fff" stroke="#54a89b"/>
  <text x="680" y="144" class="tag" fill="#285d54">逻辑</text>
  <path d="M710 81H770V139H710M770 110H820" fill="none" stroke="#687386" stroke-width="2"/>
  <circle cx="820" cy="110" r="20" fill="#fff8ec" stroke="#d29a47" stroke-width="2"/>
  <path d="M810 110L818 118L832 100" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="686" class="sub" text-anchor="middle">下层提供稳定基础，上层只记录新增或覆盖的定义</text>
</svg>
