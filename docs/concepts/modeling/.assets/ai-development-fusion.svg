<svg viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">AI 开发融合</title><desc id="desc">模型、元数据、手册和 Schema 为 AI 提供上下文，AI 参与定位、解释、生成和检查，产出模型、代码和测试，经开发者审核后进入版本管理。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#687386"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:20px;font-weight:650;fill:#0b1f3a;text-anchor:middle}.sub{font-size:14px;fill:#52657f;text-anchor:middle}.label{font-size:16px;font-weight:600;fill:#264a73;text-anchor:middle}.edge{fill:none;stroke:#687386;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="540" fill="#fff"/>
  <rect x="35" y="95" width="250" height="350" rx="14" fill="#f3f7fd" stroke="#7aa7de" stroke-width="2"/><text x="160" y="140" class="title">可信上下文</text><g class="label"><rect x="70" y="175" width="180" height="48" rx="8" fill="#fff" stroke="#7aa7de"/><text x="160" y="205">模型与元数据</text><rect x="70" y="245" width="180" height="48" rx="8" fill="#fff" stroke="#7aa7de"/><text x="160" y="275">手册与 Schema</text><rect x="70" y="315" width="180" height="48" rx="8" fill="#fff" stroke="#7aa7de"/><text x="160" y="345">项目代码与测试</text></g><text x="160" y="405" class="sub">Skills · MCP · 本地工具</text>
  <path d="M285 270H365" class="edge"/>
  <rect x="365" y="75" width="300" height="390" rx="16" fill="#f0faf7" stroke="#54a89b" stroke-width="2.5"/><text x="515" y="125" class="title">AI 参与开发</text><g class="label"><rect x="410" y="165" width="210" height="46" rx="23" fill="#fff" stroke="#54a89b"/><text x="515" y="194">定位</text><rect x="410" y="225" width="210" height="46" rx="23" fill="#fff" stroke="#54a89b"/><text x="515" y="254">解释</text><rect x="410" y="285" width="210" height="46" rx="23" fill="#fff" stroke="#54a89b"/><text x="515" y="314">生成</text><rect x="410" y="345" width="210" height="46" rx="23" fill="#fff" stroke="#54a89b"/><text x="515" y="374">检查</text></g><text x="515" y="430" class="sub">检索、生成与重复性工作</text>
  <path d="M665 270H745" class="edge"/>
  <rect x="745" y="95" width="200" height="350" rx="14" fill="#fff8ec" stroke="#d29a47" stroke-width="2"/><text x="845" y="140" class="title">开发资产</text><g class="label"><text x="845" y="205">模型</text><text x="845" y="255">代码</text><text x="845" y="305">测试</text><text x="845" y="355">文档</text></g><text x="845" y="405" class="sub">可校验、可审查</text>
  <path d="M945 270H1010" class="edge"/>
  <rect x="1010" y="145" width="160" height="250" rx="14" fill="#f8fafc" stroke="#8b95a7" stroke-width="2.5"/><text x="1090" y="195" class="title">开发者</text><text x="1090" y="245" class="label">判断</text><text x="1090" y="285" class="label">审核</text><text x="1090" y="325" class="label">授权</text><text x="1090" y="365" class="sub">进入版本管理</text>
  <path d="M1090 395V490H515V465" class="edge"/><text x="800" y="515" class="sub">审核结果和运行反馈继续完善上下文</text>
</svg>
