<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 72 1600 1148" width="1600" height="1148" role="img" aria-labelledby="metadata-assembly-title metadata-assembly-desc">
<title id="metadata-assembly-title">元数据装配与模型生效</title>
<desc id="metadata-assembly-desc">元数据从下方的程序内嵌资源、插件内嵌资源、应用目录及数据库读取，按模型契约确定生效定义，再构建模型、完成业务模型投射并接入运行环境；来源优先级以 UI Schema 的标准提供者为例。</desc>
