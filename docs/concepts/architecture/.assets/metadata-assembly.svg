</g>
<rect x="760.0" y="302" width="80" height="25" rx="3" fill="white"/><text x="800" y="320" fill="#9577b5" font-size="16" text-anchor="middle">业务模型</text>
<rect x="1328.0" y="482" width="144" height="25" rx="3" fill="white"/><text x="1400" y="500" fill="#9577b5" font-size="16" text-anchor="middle">参与目标模型装配</text>
<text x="412" y="1056" font-size="16" fill="#52657f" text-anchor="middle">二者同属 Classpath 来源，内部顺序由资源加载规则确定</text>
