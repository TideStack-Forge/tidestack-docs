<text x="400.0" y="362.0" font-size="19" fill="#52657f" text-anchor="middle">构建该类型的运行时模型对象</text>
</g>
<g data-node="projection"><rect x="880" y="280" width="640" height="112" rx="7" fill="#f5f1fc" stroke="#b3a0d6" stroke-width="1.3"/>
<text x="1200.0" y="334.0" font-size="24" font-weight="600" fill="#63448e" text-anchor="middle">业务模型投射</text>
<text x="1200.0" y="362.0" font-size="19" fill="#52657f" text-anchor="middle">形成数据、UI、接口、权限等相关模型定义</text>
</g>
<g data-node="effective"><rect x="360" y="464" width="880" height="112" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
<text x="800.0" y="518.0" font-size="24" font-weight="600" fill="#204f86" text-anchor="middle">确定生效定义</text>
<text x="800.0" y="546.0" font-size="19" fill="#52657f" text-anchor="middle">按模型标识执行内容合并，或选择高优先级的完整定义</text>
</g>
<g data-node="providers"><rect x="360" y="648" width="880" height="112" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
<text x="800.0" y="702.5" font-size="24" font-weight="600" fill="#204f86" text-anchor="middle">按模型类型读取与解析</text>
<text x="800.0" y="729.5" font-size="18" fill="#52657f" text-anchor="middle">文件加载器、资源扫描和数据库提供者读取各自支持的来源</text>
</g>
<g data-node="embedded"><rect x="64" y="896" width="336" height="112" rx="7" fill="#f5f7fa" stroke="#b3bfce" stroke-width="1.3"/>
