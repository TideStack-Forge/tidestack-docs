<text x="80" y="1142" font-size="18" fill="#805719" text-anchor="middle">低</text>
<text x="1540" y="1142" font-size="18" fill="#805719" text-anchor="middle">高</text>
<text x="820" y="1172" font-size="18" fill="#52657f" text-anchor="middle">来源优先级示例：UI Schema 为数据库 ＞ 应用目录 ＞ 内嵌 Schema；其他模型见下文规则。</text>
