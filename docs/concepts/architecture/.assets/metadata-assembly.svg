<text x="232.0" y="976.0" font-size="17" fill="#52657f" text-anchor="middle">基座与程序随包提供的模型文件</text>
</g>
<g data-node="plugin"><rect x="424" y="896" width="336" height="112" rx="7" fill="#f5f7fa" stroke="#b3bfce" stroke-width="1.3"/>
<text x="592.0" y="950.0" font-size="22" font-weight="600" fill="#43546c" text-anchor="middle">插件内嵌资源</text>
<text x="592.0" y="976.0" font-size="17" fill="#52657f" text-anchor="middle">插件随 JAR 交付的模型文件</text>
