<g data-node="request"><rect x="80" y="164" width="320" height="112" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
<text x="240.0" y="205.5" font-size="21" font-weight="600" fill="#204f86" text-anchor="middle">发送请求</text>
<text x="240.0" y="230.5" font-size="16" fill="#52657f" text-anchor="middle">业务代码／逻辑流等调用</text>
<text x="240.0" y="255.5" font-size="16" fill="#52657f" text-anchor="middle">模板、载荷与发送选项</text>
</g>
<g data-node="template"><rect x="540" y="164" width="320" height="112" rx="7" fill="#fff7e9" stroke="#d4ad69" stroke-width="1.3"/>
<text x="700.0" y="218.0" font-size="21" font-weight="600" fill="#805719" text-anchor="middle">通知模板与配置</text>
<text x="700.0" y="243.0" font-size="16" fill="#52657f" text-anchor="middle">内容模板、渠道与渠道参数</text>
</g>
