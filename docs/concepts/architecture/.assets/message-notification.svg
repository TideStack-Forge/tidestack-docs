<text x="320.0" y="721.0" font-size="22" font-weight="600" fill="#204f86" text-anchor="middle">普通发送</text>
<text x="320.0" y="747.0" font-size="17" fill="#52657f" text-anchor="middle">按渠道调用适配器</text>
<text x="320.0" y="773.0" font-size="17" fill="#52657f" text-anchor="middle">保存通知记录及各地址的发送结果</text>
</g>
<g data-node="reliable"><rect x="840" y="664" width="480" height="144" rx="7" fill="#eef9fb" stroke="#7fb9c3" stroke-width="1.3"/>
<text x="1080.0" y="708.0" font-size="22" font-weight="600" fill="#245e69" text-anchor="middle">可靠发送</text>
<text x="1080.0" y="734.0" font-size="17" fill="#52657f" text-anchor="middle">先持久化发送计划，逐发送单元领取尝试</text>
<text x="1080.0" y="760.0" font-size="17" fill="#52657f" text-anchor="middle">检查投递策略并记录渠道回执</text>
<text x="1080.0" y="786.0" font-size="17" fill="#52657f" text-anchor="middle">再次调用时接续未完成的发送单元</text>
</g>
