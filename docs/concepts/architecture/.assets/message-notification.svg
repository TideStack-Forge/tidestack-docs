<text x="1160.0" y="243.0" font-size="16" fill="#52657f" text-anchor="middle">员工标识或按渠道指定的地址</text>
</g>
<g data-node="dispatcher"><rect x="460" y="388" width="480" height="132" rx="7" fill="#f5f1fc" stroke="#b3a0d6" stroke-width="1.3"/>
