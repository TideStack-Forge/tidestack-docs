<text x="540.0" y="1087.0" font-size="16" fill="#52657f" text-anchor="middle">邮件发送适配</text>
</g>
<g data-node="sms"><rect x="720" y="1008" width="280" height="112" rx="7" fill="#effaf5" stroke="#78b59a" stroke-width="1.3"/>
<text x="860.0" y="1062.0" font-size="21" font-weight="600" fill="#216149" text-anchor="middle">短信与语音</text>
<text x="860.0" y="1087.0" font-size="16" fill="#52657f" text-anchor="middle">阿里云等渠道适配</text>
</g>
