<rect x="920.0" y="564" width="80" height="25" rx="3" fill="white"/><text x="960" y="582" fill="#43818d" font-size="16" text-anchor="middle">可靠入口</text>
<rect x="352.0" y="866" width="96" height="25" rx="3" fill="white"/><text x="400" y="884" fill="#43816c" font-size="16" text-anchor="middle">发送／结果</text>
<rect x="1112.0" y="866" width="96" height="25" rx="3" fill="white"/><text x="1160" y="884" fill="#43816c" font-size="16" text-anchor="middle">发送／回执</text>
<text x="700" y="1204" font-size="17" fill="#52657f" text-anchor="middle">通知服务独立管理发送；可靠发送通过持久计划与回执接续处理，接续时机由调用方管理。</text>
