<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 1400 1090" width="1400" height="1090" role="img" aria-labelledby="message-notification-title message-notification-desc">
<title id="message-notification-title">消息通知能力</title>
<desc id="message-notification-desc">业务代码或逻辑流向通知服务提交发送请求，服务解析模板、收件人与渠道，通过渠道适配器发送；普通发送记录结果，可靠发送另行持久化发送计划、尝试与渠道回执。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif}</style>
