<title id="backend-startup-lifecycle-title">后端基座启动生命周期</title>
<desc id="backend-startup-lifecycle-desc">Spring Boot 完成进程装配后，应用运行时按六个事件阶段刷新上下文；各模块依次读取元数据、投射和构建模型、初始化数据及校验运行契约，成功后放行请求，失败则记录启动错误。</desc>

<text x="740.0" y="77.0" font-size="20" font-weight="600" fill="#43546c" text-anchor="middle">启动进程与装配模块</text>
<text x="740.0" y="102.0" font-size="16" fill="#52657f" text-anchor="middle">Spring Boot 创建上下文，装配模块、插件及基础服务</text>
<text x="740.0" y="127.0" font-size="16" fill="#52657f" text-anchor="middle">应用运行时准备应用元数据目录、AppContext 与控制消息监听</text>
</g>

<text x="408.0" y="358.5" font-size="16" fill="#52657f" text-anchor="middle">OuroborosContextRefreshingEvent</text>
</g>
<g data-node="metadata-refreshing"><rect x="80" y="432" width="656" height="112" rx="7" fill="#eef5ff" stroke="#8eafe0" stroke-width="1.3"/>
<text x="408.0" y="485.5" font-size="20" font-weight="600" fill="#204f86" text-anchor="middle">②  刷新元数据</text>
<text x="408.0" y="510.5" font-size="16" fill="#52657f" text-anchor="middle">OuroborosMetadataRefreshingEvent</text>

</g>
<g data-node="failed"><rect x="896" y="1296" width="504" height="112" rx="7" fill="#fff1ef" stroke="#d4a09a" stroke-width="1.3"/>
<text x="1148.0" y="1337.0" font-size="20" font-weight="600" fill="#8c453b" text-anchor="middle">FAILED · 终止本轮刷新</text>
<text x="1148.0" y="1362.0" font-size="16" fill="#52657f" text-anchor="middle">记录失败阶段及模块，返回 HTTP 500</text>
<text x="1148.0" y="1387.0" font-size="16" fill="#52657f" text-anchor="middle">异常继续向上传播</text>
</g>
<rect x="552.0" y="176" width="200" height="25" rx="3" fill="white"/><text x="652" y="194" fill="#627ba4" font-size="16" text-anchor="middle">ApplicationStartedEvent</text>
<rect x="1224.0" y="1250" width="112" height="25" rx="3" fill="white"/><text x="1280" y="1268" fill="#b6746b" font-size="16" text-anchor="middle">任一阶段异常</text>
<text x="816" y="304" font-size="18" fill="#52657f" text-anchor="start">准备或清理本轮刷新所需的上下文。</text>
<text x="816" y="334" font-size="18" fill="#52657f" text-anchor="start">生命周期防护记录阶段与模块进度。</text>
<text x="816" y="456" font-size="18" fill="#52657f" text-anchor="start">各提供者读取或刷新元数据。</text>
<text x="816" y="486" font-size="18" fill="#52657f" text-anchor="start">按对应模型的来源和优先级形成定义。</text>
<text x="816" y="608" font-size="18" fill="#52657f" text-anchor="start">业务模型更新投射结果。</text>
<text x="816" y="638" font-size="18" fill="#52657f" text-anchor="start">数据、页面、接口等定义进入后续装配。</text>
<text x="816" y="760" font-size="18" fill="#52657f" text-anchor="start">数据模型等运行时刷新，逻辑流构建候选快照。</text>
<text x="816" y="790" font-size="18" fill="#52657f" text-anchor="start">具体处理顺序由模块监听器约定。</text>
<text x="816" y="912" font-size="18" fill="#52657f" text-anchor="start">更新业务模型投射、类型化数据映射。</text>
<text x="816" y="942" font-size="18" fill="#52657f" text-anchor="start">执行数据初始化，再发布逻辑流运行快照。</text>
<text x="816" y="1064" font-size="18" fill="#52657f" text-anchor="start">校验业务动作和事件订阅的运行绑定。</text>
<text x="816" y="1094" font-size="18" fill="#52657f" text-anchor="start">首次启动时注册计划任务，更新应用信息。</text>
<text x="80" y="1452" font-size="17" fill="#52657f" text-anchor="start">启动／刷新期间返回 HTTP 503；运行中刷新复用六个阶段，失败后需成功完成一次完整刷新才能恢复受保护的业务执行。</text>
