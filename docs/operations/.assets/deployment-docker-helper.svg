<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1520" width="1600" height="1520" role="img" aria-labelledby="deployment-docker-helper-title deployment-docker-helper-desc" id="deployment-docker-helper-root">
<title id="deployment-docker-helper-title">Docker · 内部开发助手部署展开</title>
<desc id="deployment-docker-helper-desc">局部展开：助手与平台同一宿主机 / bridge 网络；无公开测试应用入口；包含部署位置、数量、网络连接、挂载及单点说明。</desc>
<defs>
      <style>#deployment-docker-helper-root { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
      #deployment-docker-helper-root .diagram-container { width:100%;overflow-x:auto }
      #deployment-docker-helper-root .diagram-container svg { display:block;width:100%;min-width:1600px;height:auto }
      @media print {
#deployment-docker-helper-root .diagram-container { overflow-x:visible }
      #deployment-docker-helper-root .diagram-container svg { min-width:0 }
}
      #deployment-docker-helper-root text { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif }</style><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<marker id="deployment-docker-helper-deployment-docker-helper-traffic" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#43546c"/></marker>
<marker id="deployment-docker-helper-deployment-docker-helper-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#577dab"/></marker>
<marker id="deployment-docker-helper-deployment-docker-helper-storage" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#43816c"/></marker>
</defs><rect width="1600" height="1520" fill="#fff"/>
<text x="40" y="52" font-size="28" font-weight="600" fill="#33455e">Docker · 内部开发助手部署展开</text>
<text x="40" y="84" font-size="14" font-weight="400" fill="#596b83">局部展开：助手与平台同一宿主机 / bridge 网络；无公开测试应用入口</text>
<rect x="40" y="104" width="16" height="16" rx="3" fill="#eef5ff" stroke="#8eafe0"/>
<text x="64" y="117" font-size="12" font-weight="400" fill="#33455e">平台 / 应用</text>
<rect x="260" y="104" width="16" height="16" rx="3" fill="#eaf6f4" stroke="#8ebeb3"/>
<text x="284" y="117" font-size="12" font-weight="400" fill="#33455e">运行实例</text>
<rect x="480" y="104" width="16" height="16" rx="3" fill="#edf5eb" stroke="#a4be97"/>
<text x="504" y="117" font-size="12" font-weight="400" fill="#33455e">数据 / 存储</text>
<rect x="700" y="104" width="16" height="16" rx="3" fill="#fff5e7" stroke="#d5b78b"/>
<text x="724" y="117" font-size="12" font-weight="400" fill="#33455e">网关 / 中间件</text>
<rect x="920" y="104" width="16" height="16" rx="3" fill="#f4f6f9" stroke="#b3bfce"/>
<text x="944" y="117" font-size="12" font-weight="400" fill="#33455e">外部 / 基础设施</text>
<g data-zone="host"><rect x="40" y="152" width="1520" height="924" rx="8" fill="#fafbfc" stroke="#b3bfce" stroke-width="1.5"/>
<text x="64" y="184" font-size="14" font-weight="600" fill="#33455e">Docker 宿主机 ×1</text>
<text x="64" y="208" font-size="12" font-weight="400" fill="#596b83">沿用 Compose 主图的服务器资源、数据库、工作区与依赖落位</text>
</g>
<g data-zone="network"><rect x="64" y="436" width="1472" height="392" rx="8" fill="#f7faff" stroke="#b3bfce" stroke-width="1.5"/>
<text x="1512" y="468" font-size="14" font-weight="600" fill="#33455e" text-anchor="end">本机 bridge 网络 · 助手内部连接</text>
<text x="1512" y="492" font-size="12" font-weight="400" fill="#596b83" text-anchor="end">开发助手的内部消息通道与平台 JDWP / 调试会话分别管理</text>
</g>
