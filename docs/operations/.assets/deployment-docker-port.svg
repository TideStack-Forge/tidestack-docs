<rect x="1024" y="940" width="64" height="22" rx="3" fill="#fff" stroke="#a4be97"/><text x="1056.0" y="956" font-size="12" font-weight="400" fill="#42663a" text-anchor="middle">本机磁盘</text>
<text x="400" y="960" font-size="16" font-weight="600" fill="#42663a">宿主机持久化目录</text>
<text x="400" y="996" font-size="12" font-weight="400" fill="#596b83">部署目录 → 平台 /app/deploy；workspace/run → 实例 /app/deploy</text>
<text x="400" y="1020" font-size="12" font-weight="400" fill="#596b83">mysql-data → MySQL 数据；上传 / 文档 / 日志按实际目录持久化</text>
</g>
<g data-node="mqdata"><rect x="1176" y="920" width="336" height="128" rx="6" fill="#edf5eb" stroke="#a4be97" stroke-width="1.5"/>
<rect x="1176" y="944" width="4" height="24" fill="#a4be97"/>
<rect x="1436" y="940" width="52" height="22" rx="3" fill="#fff" stroke="#a4be97"/><text x="1462.0" y="956" font-size="12" font-weight="400" fill="#42663a" text-anchor="middle">需补齐</text>
<text x="1200" y="960" font-size="16" font-weight="600" fill="#42663a">RabbitMQ 数据</text>
<text x="1200" y="996" font-size="12" font-weight="400" fill="#596b83">长期运行补数据卷或改外部服务</text>
<text x="1200" y="1020" font-size="12" font-weight="400" fill="#596b83">原始 Compose 未固定数据卷</text>
</g>
<rect x="40" y="1160" width="976" height="248" rx="6" fill="#fff" stroke="#b3bfce"/>
<text x="64" y="1196" font-size="14" font-weight="600" fill="#33455e">连接与挂载清单</text>
<text x="64" y="1236" font-size="12" font-weight="600" fill="#33455e">平台 / 测试应用 / 助手 → MySQL</text>
<text x="368" y="1236" font-size="12" font-weight="400" fill="#596b83">TCP :3306；按各自数据源账号与数据库连接</text>
<line x1="64" y1="1246" x2="992" y2="1246" stroke="#edf0f4"/>
<text x="64" y="1268" font-size="12" font-weight="600" fill="#33455e">平台 / 测试应用 / 助手 → RabbitMQ</text>
<text x="368" y="1268" font-size="12" font-weight="400" fill="#596b83">AMQP :5672；实例可使用专用 MQ 连接</text>
<line x1="64" y1="1278" x2="992" y2="1278" stroke="#edf0f4"/>
<text x="64" y="1300" font-size="12" font-weight="600" fill="#33455e">平台 → Docker Engine</text>
<text x="368" y="1300" font-size="12" font-weight="400" fill="#596b83">Unix Socket /var/run/docker.sock；创建、查询、停止容器</text>
<line x1="64" y1="1310" x2="992" y2="1310" stroke="#edf0f4"/>
<text x="64" y="1332" font-size="12" font-weight="600" fill="#33455e">平台与实例 → 文件系统</text>
<text x="368" y="1332" font-size="12" font-weight="400" fill="#596b83">HOST_WORKSPACE_PATH 与平台工作区对应同一份文件</text>
<line x1="64" y1="1342" x2="992" y2="1342" stroke="#edf0f4"/>
<text x="64" y="1364" font-size="12" font-weight="600" fill="#33455e">用户入口与管理端口</text>
<text x="368" y="1364" font-size="12" font-weight="400" fill="#596b83">仅发布平台与测试入口；DB / MQ 管理端口示例绑定宿主机回环</text>
<rect x="1040" y="1160" width="520" height="248" rx="6" fill="#fff9f0" stroke="#d5b78b"/>
<text x="1064" y="1196" font-size="14" font-weight="600" fill="#33455e">数量、规格与故障域</text>
<text x="1064" y="1236" font-size="12" font-weight="400" fill="#805d2e">平台 ×1；测试应用 / 助手按需，每个实例 ×1</text>
<text x="1064" y="1268" font-size="12" font-weight="400" fill="#805d2e">平台、MySQL、RabbitMQ 均为单实例</text>
<text x="1064" y="1300" font-size="12" font-weight="400" fill="#805d2e">宿主机与本机磁盘是共同单点</text>
<text x="1064" y="1332" font-size="12" font-weight="400" fill="#805d2e">原始 Compose 未设置容器 CPU / 内存上限</text>
<text x="1064" y="1364" font-size="12" font-weight="400" fill="#805d2e">容量与持久化补齐后再用于团队长期运行</text>
<line x1="40" y1="1444" x2="1560" y2="1444" stroke="#b3bfce"/>
<line x1="40" y1="1468" x2="80" y2="1468" stroke="#43546c" stroke-width="2"/><text x="92" y="1473" font-size="12" font-weight="400" fill="#33455e">用户 / 业务流量</text>
<line x1="320" y1="1468" x2="360" y2="1468" stroke="#577dab" stroke-width="2" stroke-dasharray="6 5"/><text x="372" y="1473" font-size="12" font-weight="400" fill="#33455e">管理调用</text>
<line x1="568" y1="1468" x2="608" y2="1468" stroke="#43816c" stroke-width="2" stroke-dasharray="6 5"/><text x="620" y="1473" font-size="12" font-weight="400" fill="#33455e">文件读写 / 挂载</text>
<text x="920" y="1473" font-size="12" font-weight="400" fill="#596b83">v = 配套发行版本；所有图均为有明确假设的部署示例</text>
