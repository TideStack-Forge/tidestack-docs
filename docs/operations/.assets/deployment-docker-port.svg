<text x="800" y="784" font-size="12" font-weight="400" fill="#596b83">AMQP :5672 / 内部消息与命令</text>
</g>
<g data-node="files"><rect x="376" y="920" width="736" height="128" rx="6" fill="#edf5eb" stroke="#a4be97" stroke-width="1.5"/>
