<title id="deployment-docker-port-title">Docker Compose · 单服务器部署</title>
<desc id="deployment-docker-port-desc">平台、依赖与动态运行实例同机；临时端口入口；该宿主机为共同故障域；包含部署位置、数量、网络连接、挂载及单点说明。</desc>
