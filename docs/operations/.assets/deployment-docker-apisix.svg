<rect x="40" y="1160" width="976" height="248" rx="6" fill="#fff" stroke="#b3bfce"/>
<text x="64" y="1196" font-size="14" font-weight="600" fill="#33455e">连接与挂载清单</text>
<text x="64" y="1236" font-size="12" font-weight="600" fill="#33455e">浏览器 → APISIX → 测试应用</text>
<text x="368" y="1236" font-size="12" font-weight="400" fill="#596b83">稳定域名 → 网关流量端口 → ouroboros-test-app-&lt;app&gt;-&lt;env&gt;:80</text>
<line x1="64" y1="1246" x2="992" y2="1246" stroke="#edf0f4"/>
<text x="64" y="1268" font-size="12" font-weight="600" fill="#33455e">平台 → APISIX Admin API</text>
<text x="368" y="1268" font-size="12" font-weight="400" fill="#596b83">HTTP(S) /apisix/admin/routes/&lt;id&gt;；X-API-KEY；端口按实际配置</text>
<line x1="64" y1="1278" x2="992" y2="1278" stroke="#edf0f4"/>
<text x="64" y="1300" font-size="12" font-weight="600" fill="#33455e">平台 / 实例 → MySQL、RabbitMQ</text>
<text x="368" y="1300" font-size="12" font-weight="400" fill="#596b83">TCP :3306 / AMQP :5672；依赖地址需从各容器可达</text>
<line x1="64" y1="1310" x2="992" y2="1310" stroke="#edf0f4"/>
<text x="64" y="1332" font-size="12" font-weight="600" fill="#33455e">工作区与网关配置持久化</text>
<text x="368" y="1332" font-size="12" font-weight="400" fill="#596b83">工作区 bind mount；APISIX 配置存储使用所选模式的持久化</text>
<line x1="64" y1="1342" x2="992" y2="1342" stroke="#edf0f4"/>
<text x="64" y="1364" font-size="12" font-weight="600" fill="#33455e">平台自身入口</text>
<text x="368" y="1364" font-size="12" font-weight="400" fill="#596b83">单独发布平台端口；当前自动路由不负责代理开发平台</text>
<rect x="1040" y="1160" width="520" height="248" rx="6" fill="#fff9f0" stroke="#d5b78b"/>
<text x="1064" y="1196" font-size="14" font-weight="600" fill="#33455e">数量、规格与故障域</text>
<text x="1064" y="1236" font-size="12" font-weight="400" fill="#805d2e">图示平台、网关、数据库与 MQ 均为 ×1</text>
<text x="1064" y="1268" font-size="12" font-weight="400" fill="#805d2e">测试应用每个应用 / 环境 ×1，按需增加</text>
<text x="1064" y="1300" font-size="12" font-weight="400" fill="#805d2e">单网关、存储及宿主机均无自动故障切换</text>
<text x="1064" y="1332" font-size="12" font-weight="400" fill="#805d2e">etcd 等组件数量与高可用由实施方确定</text>
<text x="1064" y="1364" font-size="12" font-weight="400" fill="#805d2e">CPU / 内存 / 磁盘与 TLS 均按实际环境配置</text>
